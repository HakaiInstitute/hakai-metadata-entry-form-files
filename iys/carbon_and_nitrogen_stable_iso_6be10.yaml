identification:
  abstract:
    en: 'North Pacific salmon (Oncorhynchus spp.) were collected during the winter
      2022 Pan-Pacific International Year of the Salmon expeditions to the North Pacific
      high seas. Sampling was conducted using four vessels operating almost concomitantly
      between February 21 and April 18 across the study region: the NOAA research
      vessel Bell M. Shimada; R/V CCGS Sir John Franklin; R/V TINRO; and the F/V Northwest
      Explorer. Trawl nets were deployed at each station in the top 50 meters of the
      water column and towed for 60 minutes (night) or 90 minutes (day) at 4 to 5
      knots. A 2x2 cm sample of salmon muscle tissue was collected from above the
      lateral line and in front of the dorsal fin and stored at -80°C. Whole liver
      was collected immediately post-mortem and stored at -20°C until processing.
      Muscle and liver samples were then processed in the laboratory at the University
      of British Columbia. Muscle tissue was lyophilized in freeze drier for 48 hours,
      whereas liver samples were oven-dried at 50°C for the same duration. Dried tissue
      was homogenized using mortar and pestle, encapsulated in tin (Sn) capsules,
      and sent for measurements of carbon and nitrogen stable isotope ratios and elemental
      contents at an external lab. Samples were analysed on an Elemental Analyser
      coupled to an Isotope Ratio Mass Spectrometer. The data reported includes each
      sample ẟ13C, %C, ẟ15N, % N, and CN ratios, in addition to the metadata associated
      with each sample (e.g., coordinates of oceanographic station and bottom depth
      where salmon specimen was collected, etc.).'
    fr: 'Des saumons du Pacifique Nord (Oncorhynchus spp.) ont été capturés pendant
      les expéditions hivernales de l''Année internationale panpacifique des saumons
      en haute mer du Pacifique Nord, à l''hiver 2022. L''échantillonnage a été effectué
      à l''aide de quatre navires opérant presque simultanément entre le 21 février
      et le 18 avril dans la région étudiée : le navire de recherche de la NOAA Bell
      M. Shimada ; le R/V CCGS Sir John Franklin ; le R/V TINRO ; et le F/V Northwest
      Explorer. Des chaluts ont été déployés à chaque station dans les 50 premiers
      mètres de la colonne d''eau et remorqués pendant 60 minutes (nuit) ou 90 minutes
      (jour) à 4 à 5 nœuds. Un échantillon de 2 x 2 cm de tissu musculaire de saumon
      a été prélevé au-dessus de la ligne latérale et devant la nageoire dorsale et
      conservé à -80 °C. Le foie entier a été prélevé immédiatement après la mortem
      et conservé à -20 °C jusqu''au traitement. Des échantillons de muscle et de
      foie ont ensuite été traités dans le laboratoire de l''Université de la Colombie-Britannique.
      Les tissus musculaires ont été lyophilisés dans un lyophilisateur pendant 48
      heures, tandis que les échantillons de foie ont été séchés au four à 50 °C pendant
      la même durée. Le tissu séché a été homogénéisé à l''aide d''un mortier et d''un
      pilon, encapsulé dans des capsules d''étain (Sn) et envoyé pour mesurer les
      rapports isotopiques stables du carbone et de l''azote et les teneurs en éléments
      élémentaires dans un laboratoire externe. Les échantillons ont été analysés
      sur un analyseur élémentaire couplé à un spectromètre de masse à rapport isotopique.
      Les données déclarées incluent chaque échantillon 13C, %C, 15N, % N et les ratios
      CN, en plus des métadonnées associées à chaque échantillon (par exemple, les
      coordonnées de la station océanographique et la profondeur du fond où le spécimen
      de saumon a été collecté, etc.).'
