platform:
- description:
    en: Moored research station
  id: KCBuoy
  instruments:
  - description:
      en: Temperature and conductivity measurements are recorded by a SeaBird 16 plus
        mounted on the mooring bridle approximately one meter below the sea surface.
        The sensor is powered directly from the buoy battery and data is captured
        using a Campbell Scientific data logger. Salinity data are derived from calibrated
        conductivity and temperature measurements. Sensors are replaced and sent to
        the factory for calibration and service annually. Data are not post-calibrated.
        Annual drift for this deployment was minimal and does not impact the fCO2
        and pCO2 calculations (within the degree of accuracy of the CO2 measurement).
        No temperature or conductivity data were collected on the mooring from April
        25th to August 19th 2019, for this period data from a dock tide gauge sensor
        (OTT PLS-C) approximately 11 km away was used. The dock sensor data was corrected
        by comparing data from the two sensors between August 19th and December 31st
        2019.
      fr: Les mesures de température et de conductivité sont enregistrées par un SeaBird
        16 plus monté sur la bride d'amarrage à environ un mètre sous la surface de
        la mer. Le capteur est alimenté directement par la batterie de la bouée et
        les données sont capturées à l'aide d'un enregistreur de données Campbell
        Scientific. Les données de salinité sont dérivées de mesures calibrées de
        conductivité et de température. Les capteurs sont remplacés et envoyés à l'usine
        pour être étalonnés et entretenus chaque année. Les données ne sont pas post-étalonnées.
        La dérive annuelle pour ce déploiement était minime et n'a aucune incidence
        sur les calculs de fCO2 et de pCO2 (dans les limites du degré de précision
        de la mesure du CO2). Aucune donnée de température ou de conductivité n'a
        été collectée sur l'amarrage du 25 avril au 19 août 2019. Pendant cette période,
        les données d'un capteur marégraphique à quai (OTT PLS-C) situé à environ
        11 km ont été utilisées. Les données des capteurs de quai ont été corrigées
        en comparant les données des deux capteurs entre le 19 août et le 31 décembre
        2019.
      translations:
        fr:
          message: text translated using the Amazon translate service / texte traduit
            à l'aide du service de traduction Amazon
          verified: false
