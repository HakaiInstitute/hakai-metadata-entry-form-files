identification:
  abstract:
    en: "Estuaries provide critical habitat for over 80% of BC’s coastal fish and\
      \ wildlife, including Pacific salmon, marine mammals, and migratory birds. The\
      \ complex structure and aquatic vegetation of the estuary also serve to filter\
      \ sediments, sequester carbon dioxide (CO2), and stabilize shorelines from erosion.\
      \ Anthropogenic stressors from aquaculture, shoreline development, forestry,\
      \ and pollution can degrade estuarine habitats, impacting spatial coverage and\
      \ species diversity. In addition to human impacts, climate change is expected\
      \ to significantly impact estuary ecosystems through several mechanisms, including\
      \ rising sea-levels, ocean acidification, temperature and salinity changes,\
      \ and changes to freshwater and sediment inputs. Monitoring these variables\
      \ through time will provide an effective indication of ecosystem health and\
      \ productivity, informing decision makers of estuary impacts and resilience\
      \ to climate change. \n\nFrom 2019 to 2026, The Nature Trust of British Columbia\
      \ (NTBC) implemented a monitoring project to assess marsh resilience to sea-level\
      \ rise. As a part of the monitoring program, NTBC partnered with coastal First\
      \ Nations to collect detailed water quality data from 20 estuaries on Vancouver\
      \ Island, the Central Coast, and Haida Gwaii.  \n\nWater quality data are collected\
      \ using an RBR Maestro3 multi-parameter sonde - a multichannel, multi-sensor\
      \ data logging instrument designed for water column and estuary profiling. The\
      \ sondes include sensors for conductivity, temperature, and depth (CTD), dissolved\
      \ oxygen (DO), turbidity (Tu), and photosynthetically active radiation (PAR);\
      \ certain instruments also include pH (water alkalinity / acidity) sensors.\
      \ Data are collected during different weather events, tides (flood and ebb),\
      \ and seasons (spring, summer, fall, and winter) to fully understand the water\
      \ quality characteristics within the estuaries. These surveys are collected\
      \ quarterly, with additional surveys collected at some sites during some years,\
      \ based on staff availability and funding. For the Kw'a'luxw (Englishman) estuary,\
      \ water quality surveys were conducted by Snaw-Naw-As First Nation from April\
      \ 2020 to present. \n\nWater quality surveys within each estuary were designed\
      \ to collect cast data along a salinity gradient, from marine to fresh water.\
      \ Casts were also conducted in locations that may influence water quality in\
      \ the estuary, including tributaries (freshwater streams that flow into the\
      \ estuary or the river), urban streams and runoff, and potential sources of\
      \ effluent (stormwater or wastewater, often from industrial activity)."
    fr: "Les estuaires fournissent un habitat essentiel à plus de 80 % des poissons\
      \ et de la faune des côtes de la Colombie-Britannique, notamment le saumon du\
      \ Pacifique, les mammifères marins et les oiseaux migrateurs. La structure complexe\
      \ et la végétation aquatique de l'estuaire servent également à filtrer les sédiments,\
      \ à séquestrer le dioxyde de carbone (CO2) et à stabiliser les rives contre\
      \ l'érosion. Les facteurs de stress anthropiques liés à l'aquaculture, à l'aménagement\
      \ du littoral, à la sylviculture et à la pollution peuvent dégrader les habitats\
      \ estuariens, ce qui a un impact sur la couverture spatiale et la diversité\
      \ des espèces. Outre les impacts humains, le changement climatique devrait avoir\
      \ un impact significatif sur les écosystèmes des estuaires par le biais de plusieurs\
      \ mécanismes, notamment l'élévation du niveau de la mer, l'acidification des\
      \ océans, les changements de température et de salinité, ainsi que les modifications\
      \ des apports d'eau douce et de sédiments. La surveillance de ces variables\
      \ au fil du temps fournira une indication efficace de la santé et de la productivité\
      \ des écosystèmes, en informant les décideurs des impacts des estuaires et de\
      \ la résilience au changement climatique. \n\nDe 2019 à 2026, le Nature Trust\
      \ of British Columbia (NTBC) a mis en œuvre un projet de surveillance pour évaluer\
      \ la résilience des marais à l'élévation du niveau de la mer. Dans le cadre\
      \ du programme de surveillance, le NTBC s'est associé aux Premières nations\
      \ côtières pour recueillir des données détaillées sur la qualité de l'eau dans\
      \ 20 estuaires de l'île de Vancouver, de la côte centrale et de Haida Gwaii.\
      \ \n\nLes données sur la qualité de l'eau sont collectées à l'aide d'une sonde\
      \ multiparamétrique RBR Maestro3, un instrument d'enregistrement de données\
      \ multicanal et multicapteur conçu pour le profilage des colonnes d'eau et des\
      \ estuaires. Les sondes comprennent des capteurs de conductivité, de température\
      \ et de profondeur (CTD), d'oxygène dissous (DO), de turbidité (Tu) et de rayonnement\
      \ photosynthétiquement actif (PAR) ; certains instruments incluent également\
      \ des capteurs de pH (alcalinité/acidité de l'eau). Les données sont collectées\
      \ lors de différents événements météorologiques, marées (crues et reflux) et\
      \ saisons (printemps, été, automne et hiver) afin de bien comprendre les caractéristiques\
      \ de la qualité de l'eau dans les estuaires. Ces enquêtes sont collectées tous\
      \ les trimestres, et des enquêtes supplémentaires sont collectées sur certains\
      \ sites certaines années, en fonction de la disponibilité du personnel et du\
      \ financement. Pour l'estuaire du Kw'a'luxw (Anglais), des enquêtes sur la qualité\
      \ de l'eau ont été menées par la Première Nation Snaw-Naw-As d'avril 2020 à\
      \ aujourd'hui. \n\nLes études de la qualité de l'eau dans chaque estuaire ont\
      \ été conçues pour recueillir des données sur la fonte le long d'un gradient\
      \ de salinité, de l'eau de mer à l'eau douce. Des moulages ont également été\
      \ effectués dans des endroits susceptibles d'influencer la qualité de l'eau\
      \ dans l'estuaire, notamment dans les affluents (cours d'eau douce qui se jettent\
      \ dans l'estuaire ou dans la rivière), les cours d'eau urbains et les eaux de\
      \ ruissellement, et les sources potentielles d'effluents (eaux pluviales ou\
      \ eaux usées, souvent issues de l'activité industrielle)."
