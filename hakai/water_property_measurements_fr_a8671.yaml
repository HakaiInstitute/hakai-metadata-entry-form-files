identification:
  abstract:
    en: 'The Bute Inlet Ocean Observing Station (BIOOS) provides high-resolution profiling
      in Bute Inlet, a fjord on the British Columbia coast. A C-PROOF (Canadian Pacific
      Robotic Ocean Observing Facility) Wirewalker, a wave-powered profiler, is moored
      in the central fjord, measuring conductivity, temperature, pressure, and dissolved
      oxygen through the water column. Two versions of the record are included: provisional
      data offloaded directly from the instrument, which is the more complete, and
      real-time data received via satellite, which is the more current.'
    fr: 'La station d''observation océanique de Bute Inlet (BIOOS) fournit un profilage
      à haute résolution à Bute Inlet, un fjord situé sur la côte de la Colombie-Britannique.
      Un Wirewalker C-PROOF (Canadian Pacific Robotic Ocean Observing Facility), un
      profileur houlomoteur, est amarré dans le fjord central et mesure la conductivité,
      la température, la pression et l''oxygène dissous dans la colonne d''eau. Deux
      versions de l''enregistrement sont incluses : les données provisoires provenant
      directement de l''instrument, qui est le plus complet, et les données en temps
      réel reçues par satellite, qui sont les plus récentes.'
    translations:
      fr:
        verified: true
