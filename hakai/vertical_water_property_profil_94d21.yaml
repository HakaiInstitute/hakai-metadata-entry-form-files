- description:
    en: 'Procedure manual (version 1.0, March 2021) for processing and quality-controlling
      vertical ocean profile data, such as temperature, salinity, dissolved oxygen,
      turbidity, and light. It describes how CTD instruments from RBR and Seabird
      are deployed in the field and how their raw data are uploaded and matched with
      field metadata. It then lists the automated processing steps for each instrument
      type, which produce a consistent dataset averaged into 1-decibar depth bins.
      Quality control follows the QARTOD flagging standard, plus custom tests for
      problems like bottom hits, capped oxygen sensors, and boat shadow on light readings.
      The data are released in two versions: a provisional dataset with automated
      flags and a research dataset containing only manually reviewed, good-quality
      data.'
    fr: 'Manuel de procédures (version 1.0, mars 2021) pour le traitement et le contrôle
      de la qualité des données du profil vertical de l''océan, telles que la température,
      la salinité, l''oxygène dissous, la turbidité et la lumière. Il décrit comment
      les instruments CTD de RBR et Seabird sont déployés sur le terrain et comment
      leurs données brutes sont téléchargées et mises en correspondance avec les métadonnées
      de terrain. Il répertorie ensuite les étapes de traitement automatisées pour
      chaque type d''instrument, qui produisent un ensemble de données cohérent moyenné
      dans des tranches de profondeur de 1 décibar. Le contrôle qualité est conforme
      à la norme de signalisation QARTOD, ainsi que des tests personnalisés pour détecter
      des problèmes tels que les impacts sur le fond, les capteurs d''oxygène bloqués
      et l''ombre du bateau sur les lectures de lumière. Les données sont publiées
      en deux versions : un ensemble de données provisoire avec des indicateurs automatisés
      et un ensemble de données de recherche contenant uniquement des données de bonne
      qualité révisées manuellement.'
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
  name:
    en: Hakai Water Properties Profile Processing and QA/QC Procedure Manual (March
      31, 2021)
  url: https://github.com/HakaiInstitute/hakai-erddap/blob/master/datasets_documents/HakaiWaterPropertiesProfiles/Hakai_Water_Properties_Processing_and_QAQC_Procedure_20210331.pdf
identification:
  abstract:
    en: 'This collection contains records that describe data (temperature, conductivity,
      dissolved oxygen, fluorescence, photosynthetic active radiation, turbidity and
      coloured dissolved organic matter) collected from vertical water property profiles.
      These data were collected from ship-based casts and autonomous profilers by
      the Hakai Institute from 2012 to present in waters surrounding Calvert Island,
      Johnstone Strait, and Quadra Island areas. Users are encouraged to navigate
      to the individual records holding their data of interest, or request specific
      data using the Data Access Request Form.


      Specifically, this collection includes CTD datasets made by oceanographic profiler
      instruments (RBR XR-620, RBR Concerto, RBR Maestro, and Seabird SBE 19plus v2)
      which have been automatically processed by following respective manufacturer’s
      guidelines. Both the provisional (no manual QC) and the research-ready dataset
      are made available. The research-ready dataset provides a subset of the provisional
      dataset which have been quality controlled by applying a series of tests that
      are following the QARTOD standards and more tests specific to the Hakai Institute
      (see Hakai Water Properties Profile Processing and QA/QC Procedure Manual).
      The research-ready data are judged good for science quality level.


      Further, two versions of a dataset from a C-PROOF (Canadian Pacific Robotic
      Ocean Observing Facility) Wirewalker are made available. The Wirewalker is a
      wave-powered profiler moored in Bute Inlet, a fjord on the British Columbia
      coast. The two versions include provisional data offloaded directly from the
      instrument, which is the more complete dataset, and real-time data received
      via a satellite, which is the more current dataset.


      Data were collected by the Hakai Institute Oceanography Program, the Nearshore
      Program, and the Juvenile Salmon Program.'
    fr: 'Cette collection contient des dossiers qui décrivent les données (température,
      conductivité, oxygène dissous, fluorescence, rayonnement photosynthétique actif,
      turbidité et matière organique dissoute colorée) recueillies à partir de profils
      verticaux des propriétés de l''eau. Ces données ont été collectées à partir
      de moulages embarqués et de profileurs autonomes par l''Institut Hakai de 2012
      à aujourd''hui dans les eaux entourant les zones de l''île Calvert, du détroit
      de Johnstone et de l''île Quadra. Les utilisateurs sont invités à accéder aux
      dossiers individuels contenant les données qui les intéressent ou à demander
      des données spécifiques à l''aide du formulaire de demande d''accès aux données.


      Plus précisément, cette collection comprend des ensembles de données CTD créés
      par des instruments de profilage océanographique (RBR XR-620, RBR Concerto,
      RBR Maestro et Seabird SBE 19plus v2) qui ont été traités automatiquement conformément
      aux directives des fabricants respectifs. L''ensemble de données provisoire
      (pas de contrôle qualité manuel) et l''ensemble de données prêt pour la recherche
      sont disponibles. L''ensemble de données prêt pour la recherche fournit un sous-ensemble
      de l''ensemble de données provisoire dont la qualité a été contrôlée en appliquant
      une série de tests conformes aux normes QARTOD et d''autres tests spécifiques
      à l''Institut Hakai (voir Hakai Water Properties Profile Processing and QA/QC
      Procedure Manual). Les données prêtes pour la recherche sont jugées bonnes pour
      le niveau de qualité scientifique.


      De plus, deux versions d''un ensemble de données provenant d''un Wirewalker
      C-PROOF (Centre robotique canadien d''observation des océans du Pacifique) sont
      disponibles. Le Wirewalker est un profileur houlomoteur amarré à Bute Inlet,
      un fjord situé sur la côte de la Colombie-Britannique. Les deux versions incluent
      des données provisoires provenant directement de l''instrument, qui est l''ensemble
      de données le plus complet, et des données en temps réel reçues via un satellite,
      qui est l''ensemble de données le plus récent.


      Les données ont été recueillies par le programme océanographique de l''Institut
      Hakai, le programme Nearshore et le programme sur les saumons juvéniles.'
    translations:
      fr:
        verified: true
