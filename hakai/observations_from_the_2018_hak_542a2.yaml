identification:
  abstract:
    en: The Hakai Terrestrial Bioblitz (2018) was an intensive biodiversity survey
      of the forests, bogs, and beaches around Calvert Island, BC. Target species
      included insects, plants, lichens, birds, and mammals. Whenever possible, teams
      of taxonomists and field biologists made collections of specimens that were
      morphologically identified in the lab, photographed, and then processed for
      DNA barcoding, with the resulting sequence data added to the Barcode of Life
      Datasystem (BOLD). Voucher specimens from these collections were accessioned
      at the Royal BC Museum. Many additional observations were recorded on iNaturalist.
      This survey resulted in the identification of new species and expanded the known
      range of many others.
    fr: Le Hakai Terrestrial Bioblitz (2018) était une étude intensive de la biodiversité
      des forêts, des tourbières et des plages autour de l'île Calvert, en Colombie-Britannique.
      Les espèces cibles comprenaient des insectes, des plantes, des lichens, des
      oiseaux et des mammifères. Dans la mesure du possible, des équipes de taxonomistes
      et de biologistes de terrain ont collecté des échantillons qui ont été identifiés
      morphologiquement en laboratoire, photographiés, puis traités pour un code-barres
      ADN, les données de séquence résultantes étant ajoutées au système de données
      Barcode of Life (BOLD). Des spécimens témoins de ces collections ont été acquis
      au Royal BC Museum. De nombreuses observations supplémentaires ont été enregistrées
      sur iNaturalist. Cette étude a permis d'identifier de nouvelles espèces et d'élargir
      l'aire de répartition connue de nombreuses autres espèces.
