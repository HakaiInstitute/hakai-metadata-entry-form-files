identification:
  abstract:
    en: Marine scientific trawl surveys are commonly used to assess the distribution
      and population size of fisheries-related species, yet the method is effort-intensive
      and can be environmentally destructive. Sequencing environmental DNA (eDNA)
      from water samples can reveal the presence of organisms in a community without
      capturing them; however, we expect the detectability of taxa to differ between
      eDNA and trawl surveys, and understanding how species traits and population
      variables contribute to detection differences can help calibrate our expectations
      from each form of sampling. Here, we coupled eDNA metabarcoding and capture
      trawl surveys in British Columbia, Canada, to examine species traits that explain
      recurrent differences in detectability between the two methods, including habitat,
      body size, and biomass. At the regional scale, 17 of 23 fish species (74%) captured
      by the trawl were detected by eDNA metabarcoding, and 39 additional species
      were detected by eDNA sampling only. We found that eDNA metabarcoding disproportionately
      detected trawl-caught species with greater local biomass (i.e., greater biomass
      in the adjacent trawl). Fish detected only in eDNA had a greater range of body
      lengths and a broader range of habitat preferences outside the trawls' target
      size and sampling areas. Our results suggest that with our level of sampling,
      eDNA metabarcoding can adequately recapitulate detection of fish communities
      detected by trawl surveys, but with a bias toward fish of high population biomass
      and greater inclusion of fish from outside the trawled area.
    fr: Les relevés scientifiques marins au chalut sont couramment utilisés pour évaluer
      la distribution et la taille de la population des espèces liées à la pêche,
      mais cette méthode demande beaucoup d'efforts et peut être destructrice pour
      l'environnement. Le séquençage de l'ADN environnemental (ADNe) à partir d'échantillons
      d'eau peut révéler la présence d'organismes dans une communauté sans les capturer ;
      toutefois, nous nous attendons à ce que la détectabilité des taxons diffère
      entre les études d'ADNe et celles réalisées au chalut, et comprendre comment
      les caractéristiques des espèces et les variables démographiques contribuent
      aux différences de détection peut nous aider à calibrer nos attentes pour chaque
      forme d'échantillonnage. Ici, nous avons couplé le métabarcodage à barres de
      l'ADNe et des relevés de capture au chalut en Colombie-Britannique, au Canada,
      afin d'examiner les caractéristiques des espèces qui expliquent les différences
      récurrentes de détectabilité entre les deux méthodes, notamment l'habitat, la
      taille corporelle et la biomasse. À l'échelle régionale, 17 des 23 espèces de
      poissons (74 %) capturées par le chalut ont été détectées par méta-codage à
      barres de l'ADNe, et 39 autres espèces ont été détectées uniquement par échantillonnage
      de l'ADNe. Nous avons constaté que le métabarcodage de l'ADNe détectait de manière
      disproportionnée les espèces capturées au chalut présentant une plus grande
      biomasse locale (c'est-à-dire une plus grande biomasse dans le chalut adjacent).
      Les poissons détectés uniquement dans l'ADNe présentaient une plus grande gamme
      de longueurs corporelles et une plus grande gamme de préférences en matière
      d'habitat en dehors de la taille cible des chaluts et des zones d'échantillonnage.
      Nos résultats suggèrent que, compte tenu de notre niveau d'échantillonnage,
      le méta-codage à barres de l'ADNe peut récapituler de manière adéquate la détection
      des communautés de poissons détectées lors des relevés au chalut, mais avec
      un biais en faveur des poissons dont la biomasse démographique est élevée et
      une plus grande inclusion de poissons provenant de l'extérieur de la zone chalutée.
