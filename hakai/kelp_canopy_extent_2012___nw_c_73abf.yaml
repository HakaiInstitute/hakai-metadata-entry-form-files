identification:
  abstract:
    en: "Polygons manually created based on August 2012 air photos.\n\nTwo species\
      \ are mapped: Nereocystis luetkeana and Macrocystis pyrifera.\n\nDensity is\
      \ classified as either High or Low according the KIM 1 methodologies detailed\
      \ in the 2007 Sutherland Kelp Inventory report (http://www.env.gov.bc.ca/omfd/reports/Kelp2007-HakaiPass.pdf)\n\
      \nAreas covered: West Beach – 7th beach to West Beach + Choked Passage – Surf\
      \ Pass and North Beach to Wolf Beach North to Hakai Land and Sea Beach.\n\n\
      Air Photos gathered by Terra Remote Sensing and processed by the CEDD Lab and\
      \ Hyperspectral Lab at the University of Victoria.\n\nImagery was share with\
      \ SFU volunteer crew (Jenn Burt, Amanda Schrack, and Sebastian Mather). Quality\
      \ control checked March 2015 by Keith Holmes and Jenn Burt.\n\nKelp extent layer\
      \ is represented by polygons which were digitized manually in ARC GIS.\n\nAttributes:\n\
      \nFID - Unique identification number - ARC auto generated during polygon creation\n\
      \nShape - Polygon - spatial representation\n\nSpecies - \"Macro\" / \"Nereo\"\
      \ / Mixed detailing the two possible kelp canopy species. Macro refers to macrocystis\
      \ pyrifera or giant kelp. Nereo refers to nereocystis luetkeana or bull kelp.\
      \ Mixed is a homogenous mix of both Macro and Nereo species. Defined by GIS\
      \ techs - identified by \"credit\" field. \n\nDensity - density of kelp defined\
      \ as either high or low. Based on the Sutherland methodology for kelp density.\
      \ High = high density / based on mean kelp plants found per square meter. Low\
      \ = low density - still a continuous bed of kelp with large gaps the length\
      \ of each fond.\n\nArea sq_m - size of each kelp bed in square meters. Defined\
      \ by arc geometry calculation.\n\nConcat - concatenation of species and density\
      \ information. Used for cartographic purposes. Defined by concatenating species\
      \ and density metrics in ARC GIS.\n\nConfidence - Used by GIS technician to\
      \ identify difficult to detect species / kelp bed extent / density. Used to\
      \ inform reviewers and quality control spatial information. High = High confidence\
      \ - no need to check over, Medium = medium confidence - check over, Low = low\
      \ confidence - unsure of major elements - reviewer check over. A \"Checked\"\
      \ may be added to the information to determine quality control has been completed\
      \ on low confidence polygons. Determined by the last \"credit\" reviewer.\n\n\
      Credit - Initials of GIS technician to create and give the final quality check\
      \ on the kelp extent polygon. KH = Keith Holmes, JB = Jenn Burt, AS = Amanda\
      \ Schrack, SM = Sebastian Mather.\n\nSpecies_la - full Latin species name for\
      \ the kelp. macrocystis pyrifera / nereocystis luetkeana / mixed. Mixed has\
      \ a homogenous mix of both macrocystis pyrifera and nereocystis luetkeana species\n\
      \n\nDataset created by Jenn Burt and Keith Holmes. Simon Fraser University Volunteers:\
      \ Amanda Schrack and Sebastian Mather\nContact: data@hakai.org"
    fr: "Polygones créés manuellement à partir de photos aériennes prises en août\
      \ 2012.\n\nDeux espèces sont cartographiées : Nereocystis luetkeana et Macrocystis\
      \ pyrifera.\n\nLa densité est classée comme élevée ou faible selon les méthodologies\
      \ KIM 1 détaillées dans le rapport d'inventaire du varech de Sutherland 2007\
      \ (http://www.env.gov.bc.ca/omfd/reports/Kelp2007-HakaiPass.pdf)\n\nZones couvertes :\
      \ West Beach — 7e plage à West Beach + Choked Passage — Surf Pass et North Beach\
      \ à Wolf Beach North jusqu'à Hakai Land and Sea Beach.\n\nPhotos aériennes recueillies\
      \ par Terra Remote Sensing et traitées par le laboratoire CEDD et le laboratoire\
      \ hyperspectral de l'Université de Victoria.\n\nLes images ont été partagées\
      \ avec l'équipe de bénévoles de la SFU (Jenn Burt, Amanda Schrack et Sebastian\
      \ Mather). Contrôle qualité vérifié en mars 2015 par Keith Holmes et Jenn Burt.\n\
      \nLa couche d'étendue de varech est représentée par des polygones qui ont été\
      \ numérisés manuellement dans ARC GIS.\n\nAttributs :\n\nFID - Numéro d'identification\
      \ unique - ARC généré automatiquement lors de la création du polygone\n\nForme\
      \ - Polygone - représentation spatiale\n\nEspèces - « Macro »/« Nereo »/Mixte\
      \ détaillant les deux espèces possibles de la canopée de varech. Macro fait\
      \ référence à macrocystis pyrifera ou varech géant. Nereo fait référence à nereocystis\
      \ luetkeana ou varech taureau. Mixed est un mélange homogène d'espèces Macro\
      \ et Nereo. Défini par les techniciens des SIG - identifié par le champ « crédit ».\
      \ \n\nDensité : densité du varech définie comme étant élevée ou faible. Basé\
      \ sur la méthodologie de Sutherland pour la densité du varech. Élevé = haute\
      \ densité/basé sur la moyenne des plants de varech trouvés par mètre carré.\
      \ Faible = faible densité - il s'agit toujours d'un lit continu de varech avec\
      \ de grands espaces sur la longueur de chaque fond.\n\nSuperficie en m² - taille\
      \ de chaque lit de varech en mètres carrés. Défini par le calcul de la géométrie\
      \ de l'arc.\n\nConcat - concaténation d'informations sur les espèces et la densité.\
      \ Utilisé à des fins cartographiques. Défini par la concaténation des espèces\
      \ et des métriques de densité dans ARC GIS.\n\nConfiance - Utilisée par un technicien\
      \ en SIG pour identifier les espèces difficiles à détecter, l'étendue et la\
      \ densité du lit de varech. Utilisé pour informer les réviseurs et contrôler\
      \ la qualité des informations spatiales. Haut = niveau de confiance élevé -\
      \ pas besoin de vérifier, moyen = niveau de confiance moyen - vérification,\
      \ faible = niveau de confiance faible - incertitude quant aux principaux éléments\
      \ - vérification par l'évaluateur. La mention « Vérifié » peut être ajoutée\
      \ aux informations pour déterminer que le contrôle qualité a été effectué sur\
      \ les polygones à faible niveau de confiance. Déterminé par le dernier évaluateur\
      \ de « crédit ».\n\nCrédit : Initiales du technicien en SIG chargé de créer\
      \ le polygone d'étendue du varech et d'effectuer le contrôle de qualité final.\
      \ KH = Keith Holmes, JB = Jenn Burt, États-Unis = Amanda Schrack, SM = Sebastian\
      \ Mather.\n\nSpecies_LA - nom latin complet de l'espèce pour le varech. macrocystis\
      \ pyrifera/nereocystis luetkeana/mixed. Mixed contient un mélange homogène d'espèces\
      \ macrocystis pyrifera et nereocystis luetkeana\n\n\nEnsemble de données créé\
      \ par Jenn Burt et Keith Holmes. Bénévoles de l'Université Simon Fraser : Amanda\
      \ Schrack et Sebastian Mather\nContactez : data@hakai.org"
