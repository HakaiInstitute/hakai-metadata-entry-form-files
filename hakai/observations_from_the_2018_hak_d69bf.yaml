identification:
  abstract:
    en: The Hakai Institute Seagrass Bioblitz (2018) was an intensive biodiversity
      survey of the seagrass beds around Calvert Island, BC. Whenever possible, teams
      of taxonomists and field biologists made collections of specimens that were
      morphologically identified in the lab, photographed, and then processed for
      DNA barcoding, with the resulting sequence data added to the Barcode of Life
      Datasystem (BOLD). This survey provided a wealth of detailed information about
      the diversity of marine invertebrates and fish inhabiting seagrass beds around
      Calvert Island.
    fr: Le Hakai Institute Seagrass Bioblitz (2018) était une étude intensive de la
      biodiversité des herbiers marins autour de l'île Calvert, en Colombie-Britannique.
      Dans la mesure du possible, des équipes de taxonomistes et de biologistes de
      terrain ont collecté des échantillons qui ont été identifiés morphologiquement
      en laboratoire, photographiés, puis traités pour un code-barres ADN, les données
      de séquence résultantes étant ajoutées au système de données Barcode of Life
      (BOLD). Cette étude a fourni une mine d'informations détaillées sur la diversité
      des invertébrés marins et des poissons qui peuplent les herbiers marins autour
      de l'île Calvert.
