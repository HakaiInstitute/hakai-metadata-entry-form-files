identification:
  abstract:
    en: This metadata catalogue provides links to an intensive eDNA-based biodiversity
      survey near Quadra Island, British Columbia. From 2020-2023 we collected weekly
      or bi-weekly eDNA samples from a fixed location in Hyacinthe Bay (50.117, -125.223).
      Samples were derived from triplicate 1L seawater samples collected just below
      the surface. Seawater was filtered using 0.22uL sterivex filters and the resulting
      eDNA was used for DNA metabarcoding using primers that target a 313bp fragment
      of the cytochrome c-oxidase subunit 1 (COI) gene. These data provide fine-scale
      data on the diversity and seasonality of nearshore marine invertebrate communities.
    fr: Ce catalogue de métadonnées fournit des liens vers une étude intensive de
      la biodiversité basée sur l'EDNA près de l'île Quadra, en Colombie-Britannique.
      De 2020 à 2023, nous avons prélevé des échantillons d'ADNe hebdomadaires ou
      bihebdomadaires à un endroit fixe de la baie d'Hyacinthe (50.117, -125.223).
      Les échantillons ont été prélevés à partir d'échantillons d'eau de mer de 1
      L en trois exemplaires prélevés juste sous la surface. L'eau de mer a été filtrée
      à l'aide de filtres stérivex de 0,22 µL et l'ADNe résultant a été utilisé pour
      le métabarcodage de l'ADN à l'aide d'amorces ciblant un fragment de 313 pb du
      gène de la sous-unité 1 (COI) du cytochrome c-oxydase. Ces données fournissent
      des données à petite échelle sur la diversité et la saisonnalité des communautés
      d'invertébrés marins côtiers.
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
