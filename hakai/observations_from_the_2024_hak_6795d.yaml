identification:
  abstract:
    en: The Hakai Institute Quadra Island Bioblitz (2024) was an intensive biodiversity
      survey of the marine and terrestrial habitats around Quadra Island, BC. Throughout
      the three-week BioBlitz, teams of taxonomists and field biologists made collections
      of specimens that were morphologically identified in the lab, photographed,
      and then processed for DNA barcoding, with the resulting sequence data added
      to the Barcode of Life Datasystem (BOLD). In addition to genetic analysis, a
      large number of additional species were documented using iNaturalist.
    fr: Le Hakai Institute Quadra Island Bioblitz (2024) était une étude intensive
      de la biodiversité des habitats marins et terrestres autour de l'île Quadra,
      en Colombie-Britannique. Tout au long des trois semaines de BioBlitz, des équipes
      de taxonomistes et de biologistes de terrain ont collecté des échantillons qui
      ont été identifiés morphologiquement en laboratoire, photographiés, puis traités
      pour un code-barres ADN, les données de séquence qui en ont résulté étant ajoutées
      au système de données Barcode of Life (BOLD). Outre l'analyse génétique, un
      grand nombre d'espèces supplémentaires ont été documentées à l'aide d'iNaturalist.
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
