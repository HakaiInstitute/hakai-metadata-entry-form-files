identification:
  abstract:
    en: The survey aims to investigate the spatial and temporal (seasonal effects)
      on microbial kelp-tissue communities associated with the Pacific Bull Kelp Nereocystis
      luetkeana and the Giant Kelp Macrocystis spp. In total, we visited 10 sites
      across the Salish Sea, Strait of Juan de Fuca and the Central Coast of British
      Columbia, Canada. Key sites were surveyed on a semi-monthly basis to allow us
      to detect microbial responses and changes in their diversity and community,
      and differences between both host species. Bacterial communities will be assessed
      by collected swab samples of host tissue, followed by 16S analysis and compared
      to the surrounding water columns. Microbial data will be set into context to
      sea temperature, overall host health (e.g. blade bleaching) and biofouling of
      the host organisms (e.g. by bryozoa, amphipoda and other macro organisms). Another
      aspect of this survey is the differences over time of microbial communities
      associated with Nereocystis blades, external bulb (pneumatocyst) and internal
      bulb, and the potential change in communities due to air exposure of the host
      organism during low tides.
    fr: L'étude vise à étudier les effets spatiaux et temporels (effets saisonniers)
      sur les communautés microbiennes de tissus de varech associées au varech à taureaux
      du Pacifique Nereocystis luetkeana et au varech géant Macrocystis spp. Au total,
      nous avons visité 10 sites dans la mer des Salish, dans le détroit de Juan de
      Fuca et sur la côte centrale de la Colombie-Britannique, au Canada. Les sites
      clés ont été étudiés tous les deux mois pour nous permettre de détecter les
      réponses microbiennes et les changements dans leur diversité et leur communauté,
      ainsi que les différences entre les deux espèces hôtes. Les communautés bactériennes
      seront évaluées en prélevant des échantillons de tissu hôte sur écouvillons,
      puis en effectuant une analyse 16S et en les comparant aux colonnes d'eau environnantes.
      Les données microbiennes seront mises en contexte en fonction de la température
      de la mer, de la santé globale de l'hôte (par exemple, le blanchiment des lames)
      et de l'encrassement biologique des organismes hôtes (par exemple par des bryozoaires,
      des amphipodes et d'autres macroorganismes). Un autre aspect de cette étude
      concerne les différences dans le temps entre les communautés microbiennes associées
      aux lames de Néréocyste, au bulbe externe (pneumatocyste) et au bulbe interne,
      ainsi que le changement potentiel des communautés dû à l'exposition à l'air
      de l'organisme hôte pendant les marées basses.
