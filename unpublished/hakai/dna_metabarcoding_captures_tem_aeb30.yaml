identification:
  abstract:
    en: "In this study, we evaluated how well DNA metabarcoding of environmental samples\
      \ captures changes in marine mesozooplankton community composition to optimize\
      \ the use of sequencing data for studying seasonal dynamics. Although DNA metabarcoding\
      \ is increasingly used to monitor the distribution of marine communities, there\
      \ is a lack of standardized methods, and it remains uncertain to what extent\
      \ the DNA data reflects patterns of community dynamics observed by other methods.\
      \ \n\nTo capture seasonal changes in the mesozooplankton community dynamics,\
      \ samples were collected from small research vessels every 2 weeks before noon\
      \ (8 a.m.–12 p.m.) during 2017 from a deep-water temperate coastal station (QU39)\
      \ in the northern Salish Sea, British Columbia (in the Sutil Channel between\
      \ Marina Island and Quadra Island, lat: 50.0307, long: −125.0992; bottom depth\
      \ of 260 m, Del Bel Belluz et al. 2021). To evaluate the differences between\
      \ sampling and analysis methods, three different kinds of samples were collected\
      \ (Fig. 1b). Zooplankton net samples were collected according to the standard\
      \ method for zooplankton monitoring in the Strait of Georgia (Mackas et al.\
      \ 2013, Perry et al. 2021) using a bongo ring net with weighted cod ends (0.5\
      \ m diameter, 250 µm mesh size; Aquatic Research Instruments, Hope, BC, Canada).\
      \ In brief, the net was towed vertically from a stationary position, from ∼10\
      \ m above the bottom (in our case ∼230 m depth) to the surface, retrieved at\
      \ 1 meter per second, and with a calibrated flow meter attached to record the\
      \ sampled volume. One net was preserved in a 4% formaldehyde seawater solution\
      \ for microscopic analysis. A second net was preserved in 95% ethanol for DNA\
      \ metabarcoding. Two-liter water samples were collected weekly with Niskin bottles\
      \ from near the surface at 5, 30, 100, and 260 m depths. The water was filtered\
      \ onto separate 0.22 µm polycarbonate Sterivex filters and preserved at −80°C\
      \ after the addition of a sucrose lysis buffer until further molecular analysis.\
      \ During this sampling campaign, a total of 24 zooplankton nets were collected\
      \ for microscopic analysis, 26 zooplankton nets for DNA analysis, and 218 filtered\
      \ water samples from 43 different dates were collected for DNA analysis\n\n\
      To assess if taxa specific trends are sensitive to the selection of genetic\
      \ marker, we sequenced both short fragment of the COI gene, with primers optimized\
      \ to capture marine invertebrate community (Leray et al., 2013) and the 18S\
      \ gene, with universal primers optimized for marine microbial eukaryotes (Balzano\
      \ et al., 2015) on an Illumina MiSeq in the Hakai Genome Lab. In doing so, we\
      \ provide both new insights into the reliability of DNA metabarcoding analysis\
      \ and guidelines for future studies that aim to use environmental DNA to study\
      \ marine community dynamics. Further, through analysis of discreet water column\
      \ DNA samples, we demonstrate the potential of the DNA approach in resolving\
      \ differences in vertical zooplankton distributions."
    fr: "Dans cette étude, nous avons évalué dans quelle mesure le métabarcodage de\
      \ l'ADN d'échantillons environnementaux capte les changements dans la composition\
      \ de la communauté du mésozooplancton marin afin d'optimiser l'utilisation des\
      \ données de séquençage pour étudier la dynamique saisonnière. Bien que le métabarcodage\
      \ de l'ADN soit de plus en plus utilisé pour surveiller la distribution des\
      \ communautés marines, il n'existe pas de méthodes normalisées, et on ne sait\
      \ toujours pas dans quelle mesure les données ADN reflètent les modèles de dynamique\
      \ des communautés observés par d'autres méthodes. \n\nAfin de saisir les changements\
      \ saisonniers de la dynamique des communautés du mésozooplancton, des échantillons\
      \ ont été prélevés sur de petits navires de recherche toutes les deux semaines\
      \ avant midi (8 h à 12 h) en 2017 dans une station côtière tempérée en eau profonde\
      \ (QU39) du nord de la mer des Salish, en Colombie-Britannique (dans le canal\
      \ Sutil entre l'île Marina et l'île Quadra, lat : 50,0307, longueur : −125,0992 ;\
      \ profondeur du fond de 260 m, Del Bel Belluz et coll. (2021). Pour évaluer\
      \ les différences entre les méthodes d'échantillonnage et d'analyse, trois types\
      \ d'échantillons différents ont été collectés (Fig. 1b). Des échantillons de\
      \ filets contre le zooplancton ont été prélevés conformément à la méthode standard\
      \ de surveillance du zooplancton dans le détroit de Géorgie (Mackas et al. 2013,\
      \ Perry et al. 2021) à l'aide d'un filet annulaire à bongo aux extrémités pondérées\
      \ (0,5 m de diamètre, maillage de 250 µm ; Aquatic Research Instruments, Hope,\
      \ Colombie-Britannique, Canada). En bref, le filet a été remorqué verticalement\
      \ depuis une position stationnaire, de 10 m au-dessus du fond (dans notre cas,\
      \ 230 m de profondeur) jusqu'à la surface, récupéré à 1 mètre par seconde et\
      \ avec un débitmètre étalonné fixé pour enregistrer le volume échantillonné.\
      \ Un filet a été conservé dans une solution d'eau de mer à 4 % de formaldéhyde\
      \ pour une analyse microscopique. Un deuxième filet a été conservé dans de l'éthanol\
      \ à 95 % pour le métabarcodage de l'ADN. Des échantillons d'eau de deux litres\
      \ ont été prélevés chaque semaine avec des bouteilles Niskin près de la surface\
      \ à 5, 30, 100 et 260 m de profondeur. L'eau a été filtrée sur des filtres Sterivex\
      \ en polycarbonate séparés de 0,22 µm et conservée à -80 °C après l'ajout d'un\
      \ tampon de lyse au saccharose jusqu'à une analyse moléculaire plus approfondie.\
      \ Au cours de cette campagne d'échantillonnage, un total de 24 filets à zooplancton\
      \ ont été collectés à des fins d'analyse microscopique, 26 filets à zooplancton\
      \ pour l'analyse de l'ADN et 218 échantillons d'eau filtrée provenant de 43\
      \ dates différentes ont été collectés à des fins d'analyse ADN\n\nPour évaluer\
      \ si les tendances spécifiques aux taxons sont sensibles à la sélection d'un\
      \ marqueur génétique, nous avons séquencé à la fois un court fragment du gène\
      \ COI, avec des amorces optimisées pour capturer la communauté d'invertébrés\
      \ marins (Leray et al., 2013) et le gène 18S, avec des amorces universelles\
      \ optimisées pour les eucaryotes microbiens marins (Balzano et al., 2015) sur\
      \ un Illumina MiSeq du Hakai Genome Lab. Ce faisant, nous fournissons à la fois\
      \ de nouvelles informations sur la fiabilité de l'analyse des méta-codes à barres\
      \ de l'ADN et des lignes directrices pour les futures études visant à utiliser\
      \ l'ADN environnemental pour étudier la dynamique des communautés marines. De\
      \ plus, grâce à l'analyse d'échantillons d'ADN discrets de la colonne d'eau,\
      \ nous démontrons le potentiel de l'approche ADN pour résoudre les différences\
      \ dans les distributions verticales du zooplancton."
