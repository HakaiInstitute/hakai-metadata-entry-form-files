identification:
  abstract:
    en: This metadata package contains samples collected as part of a three-year initiative
      aimed at identifying and filling gaps in DNA barcode sequence availability for
      coastal marine micro-invertebrates. We used year-round, bi-weekly collections
      at a fixed near-shore location in Hyacinth Bay near Quadra Island British Columbia
      to survey the seasonal diversity of zooplankton and other micro-invertebrates.
      Additional samples were collected from a broader range of depths and habitats
      in the surrounding region using plankton nets, light traps, and short-term recruitment
      devices (settlement plates). DNA barcoding targeting the mitochondrial COI gene
      was successful for 2,914 specimens spanning 15 different phyla.
    fr: Ce package de métadonnées contient des échantillons collectés dans le cadre
      d'une initiative triennale visant à identifier et à combler les lacunes dans
      la disponibilité des séquences de codes-barres d'ADN pour les micro-invertébrés
      marins côtiers. Nous avons effectué des collectes toutes les deux semaines tout
      au long de l'année à un endroit fixe près du rivage à Hyacinth Bay, près de
      l'île Quadra, en Colombie-Britannique, pour étudier la diversité saisonnière
      du zooplancton et d'autres micro-invertébrés. Des échantillons supplémentaires
      ont été prélevés dans un plus large éventail de profondeurs et d'habitats de
      la région environnante à l'aide de filets à plancton, de pièges lumineux et
      de dispositifs de recrutement à court terme (plaques de peuplement). Le codage
      à barres de l'ADN ciblant le gène COI mitochondrial a été efficace pour 2 914
      échantillons provenant de 15 phylums différents.
