identification:
  abstract:
    en: "Fjords are deep-water estuaries that support a wide range of marine habitats\
      \ for pelagic fish. Yet, knowledge gaps in fish distribution and habitat use\
      \ limit the implementation of efficient marine conservation strategies within\
      \ fjords. Using British Columbia fjords as a case study, we demonstrated that\
      \ eDNA metabarcoding combined with species traits can enhance the detection\
      \ and monitoring of conservation priority species (CPS) within systematic conservation\
      \ planning frameworks. \n\nSamples were collected at four time-points: late\
      \ January/February (winter), May (spring), August (summer), and November (fall)\
      \ 2023 from the five British Columbia Fjords: Indian Arm (səl ̓ilwət in hən̓q̓əmin̓əm̓),\
      \ Howe Sound (Átl'ḵa7tsem in Squamish), Toba Inlet (yɛkʷamɛn in Homalco), Bute\
      \ Inlet, and Rivers Inlet (Wánuǧvaxsiwa in Oowekyala). Three to five stations\
      \ were sampled within each fjord and discrete 2 L environmental DNA (eDNA) samples\
      \ were collected using Niskin bottles at the surface, 10 m below the surface,\
      \ 100 m below the surface, and 10 m above the bottom.  \n\nFrom the eDNA samples,\
      \ the fish community was mapped using metabarcoding targeting a small region\
      \ of the mitochondrial 12S rRNA gene using MiFish-U universal primer set. Independent\
      \ sequencing libraries were prepared for each of the four seasonal datasets,\
      \ and each was sequenced using Illumina MiSeq V3 chemistry at the Hakai Genome\
      \ Lab on Quadra Island, BC.\n\nSpatiotemporal eDNA patterns confirmed the presence\
      \ of endangered eulachon (Thaleichthys pacificus) across three fjords and identified\
      \ deep fjord habitats as conservation priorities for mesopelagic species, including\
      \ sensitive elasmobranchs and diel vertical migrators such as northern lampfish\
      \ (Stenobrachius leucopsarus). eDNA peaks for several CPS during winter and\
      \ spring matched documented spawning windows, underscoring the importance of\
      \ fjords as seasonal spawning habitat. This globally transferable approach can\
      \ supplement local stewardship initiatives and long-term monitoring efforts,\
      \ contributing to more effective marine conservation area design and management."
    fr: "Les fjords sont des estuaires en eau profonde qui abritent un large éventail\
      \ d'habitats marins pour les poissons pélagiques. Pourtant, les lacunes dans\
      \ les connaissances sur la distribution des poissons et l'utilisation de l'habitat\
      \ limitent la mise en œuvre de stratégies efficaces de conservation marine dans\
      \ les fjords. En utilisant les fjords de la Colombie-Britannique comme étude\
      \ de cas, nous avons démontré que le métabarcodage de l'ADNe combiné aux caractéristiques\
      \ des espèces peut améliorer la détection et la surveillance des espèces prioritaires\
      \ pour la conservation (CPS) dans le cadre de plans de conservation systématiques.\
      \ \n\nDes échantillons ont été prélevés à quatre moments : fin janvier/février\
      \ (hiver), mai (printemps), août (été) et novembre (automne) 2023 dans les cinq\
      \ fjords de la Colombie-Britannique : Indian Arm (səl ̓ilwət in hən̓q̓əmin̓əmde),\
      \ Howe Sound (Átl'a7tsem à Squamish), Toba Inlet (yṣkamṣamn à Homalco), Bute\
      \ Inlet et Rivers Inlet (Wánu-vaxsiwa à Oowekyala). Trois à cinq stations ont\
      \ été échantillonnées dans chaque fjord et des échantillons discrets d'ADN environnemental\
      \ (ADNe) de 2 L ont été prélevés à l'aide de bouteilles Niskin à la surface,\
      \ à 10 m sous la surface, à 100 m sous la surface et à 10 m au-dessus du fond.\
      \ Les données de température et de salinité ont également été collectées à chaque\
      \ instant à l'aide d'un CTD.\n\nÀ partir des échantillons d'ADNe, la communauté\
      \ de poissons a été cartographiée à l'aide d'un métabarcoding ciblant une petite\
      \ région du gène de l'ARNr 12S mitochondrial à l'aide du jeu d'amorces universelles\
      \ miFISH-U. Des bibliothèques de séquençage indépendantes ont été préparées\
      \ pour chacun des quatre ensembles de données saisonniers, et chacun a été séquencé\
      \ à l'aide de la chimie Illumina MiSeq V3 au Hakai Genome Lab sur l'île Quadra,\
      \ en Colombie-Britannique.\n\nLes profils d'ADNe spatiotemporels ont confirmé\
      \ la présence d'eulakane (Thaleichthys pacificus) en voie de disparition dans\
      \ trois fjords et ont identifié les habitats des fjords profonds comme des priorités\
      \ de conservation pour les espèces mésopélagiques, notamment les élasmobranches\
      \ sensibles et les migrateurs verticaux quotidiens tels que la lampfish nordique\
      \ (Stenobrachius leucopsarus). Les pics d'ADNe de plusieurs CPS en hiver et\
      \ au printemps correspondaient aux périodes de frai documentées, soulignant\
      \ l'importance des fjords Les morues comme habitat de frai saisonnier. Cette\
      \ approche transférable à l'échelle mondiale peut compléter les initiatives\
      \ locales d'intendance et les efforts de surveillance à long terme, contribuant\
      \ ainsi à une conception et à une gestion plus efficaces des aires marines de\
      \ conservation."
