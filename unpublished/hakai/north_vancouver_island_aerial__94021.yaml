identification:
  abstract:
    en: "In 2024, Hakai collected fixed-wing imagery from the Hakai ACO for the North\
      \ Vancouver Island MaPP subregion in partnership with MaPP RKMP to map the species-level\
      \ distribution of kelp forests across areas identified as important by each\
      \ subregion. Surveys conducted by the Hakai ACO are targeted to collect imagery\
      \ during summer low tides when kelp biomass is at its highest. The high resolution\
      \ of the aerial cameras permit the discrimination of different kelp species.\
      \ Hakai Institute has also created a state-of-the-art AI tool which automates\
      \ the detection of kelp canopy area by species, greatly reducing the time between\
      \ imagery collection and data products. \n\nProject Participants: \nMaPP is\
      \ a co-led process between 17 First Nations and the Province of British Columbia\
      \ (BC) (“the MaPP partners”) that developed and are collaboratively implementing\
      \ sub-regional marine plans for BC’s North Pacific Coast. The MaPP partners\
      \ are implementing a marine plan for each sub-region (Haida Gwaii, North Coast,\
      \ Central Coast and North Vancouver Island). A broader Regional Action Framework\
      \ that establishes regional MaPP actions that the partners have identified as\
      \ being most appropriately implemented at a regional scale and that are consistent\
      \ with, and support, sub-regional plan recommendations."
    fr: "En 2024, Hakai a collecté des images à voilure fixe auprès de l'ACO de Hakai\
      \ pour la sous-région mApp de North Vancouver Island en partenariat avec mApp\
      \ RKMP afin de cartographier la distribution des forêts de varech au niveau\
      \ des espèces dans les zones identifiées comme importantes par chaque sous-région.\
      \ Les enquêtes menées par l'ACO de Hakai visent à collecter des images pendant\
      \ les marées basses estivales, lorsque la biomasse de varech est à son maximum.\
      \ La haute résolution des caméras aériennes permet de distinguer les différentes\
      \ espèces de varech. L'Institut Hakai a également créé un outil d'IA de pointe\
      \ qui automatise la détection de la superficie du couvert végétal de varech\
      \ par espèce, réduisant ainsi considérablement le temps entre la collecte d'images\
      \ et les produits de données. \n\nParticipants au projet : \nLe mApp est un\
      \ processus codirigé par 17 Premières Nations et la province de la Colombie-Britannique\
      \ (« les partenaires du mApp ») qui a élaboré et met en œuvre en collaboration\
      \ des plans marins sous-régionaux pour la côte Pacifique Nord de la Colombie-Britannique.\
      \ Les partenaires du mApp mettent en œuvre un plan marin pour chaque sous-région\
      \ (Haida Gwaii, côte nord, côte centrale et nord de l'île de Vancouver). Un\
      \ cadre d'action régional plus large qui établit les actions régionales du MApp\
      \ que les partenaires ont identifiées comme étant les plus appropriées à mettre\
      \ en œuvre à l'échelle régionale et qui sont cohérentes avec les recommandations\
      \ du plan sous-régional et les soutiennent."
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
