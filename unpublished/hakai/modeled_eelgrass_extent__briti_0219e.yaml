    limitations:
      en: 'The modeling outputs of this work were dependent on (1) the resolution
        and accuracy of bathymetric data (which was not available for all parts of
        the BC coast) and (2) ShoreZone coverage (not all parts of the BC coast were
        surveyed using ShoreZone methods at the time of the analysis). ShoreZone data
        has been shown to underestimate the presence of eelgrass and the ability of
        ShoreZone to map the presence of eelgrass depends on eelgrass being visible
        in the intertidal and shallow subtidal region during the low tide imagery
        acquisition, therefore deeper subtidal beds are missed. ShoreZone data, and
        therefore these modeled outputs, represents a snapshot in time. Given known
        long-term dynamics of eelgrass meadows, these data do not indicate areas that
        have undergone losses or gains in eelgrass extent. Please refer to the report
        summary which contains a map that shows regions where eelgrass extent was
        not modeled due to the lack of available bathymetry and/or ShoreZone data.


        Appropriate credit must be given to Hakai Institute and the authors of the
        dataset.'
      fr: 'Les résultats de modélisation de ce travail dépendaient (1) de la résolution
        et de la précision des données bathymétriques (qui n''étaient pas disponibles
        pour toutes les parties de la côte de la Colombie-Britannique) et (2) de la
        couverture de ShoreZone (les régions de la côte de la Colombie-Britannique
        n''étaient pas toutes étudiées à l''aide des méthodes ShoreZone au moment
        de l''analyse). Il a été démontré que les données de ShoreZone sous-estiment
        la présence de zostère marine et que la capacité de ShoreZone à cartographier
        la présence de zostère dépend de la visibilité de la zostère dans la région
        intertidale et subtidale peu profonde lors de l''acquisition d''images à marée
        basse, de sorte que les lits subtidaux plus profonds ne sont pas pris en compte.
        Les données ShoreZone, et donc ces sorties modélisées, représentent un instantané
        temporel. Compte tenu de la dynamique à long terme connue des prairies de
        zostère, ces données n''indiquent pas les zones qui ont subi des pertes ou
        des gains en termes d''étendue de zostère. Veuillez consulter le résumé du
        rapport qui contient une carte montrant les régions où l''étendue de la zostère
        marine n''a pas été modélisée en raison du manque de données bathymétriques
        et/ou ShoreZone disponibles.


        Un crédit approprié doit être accordé à l''Institut Hakai et aux auteurs de
        l''ensemble de données.'
