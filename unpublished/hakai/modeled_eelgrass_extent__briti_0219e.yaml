identification:
  abstract:
    en: "This dataset represents modeled areal extent of eelgrass meadows (Zostera\
      \ marina) in coastal British Columbia, Canada. This dataset was generated between\
      \ 2016 and 2017 as part of the Commission for Environmental Cooperation efforts\
      \ to estimate blue carbon storage in eelgrass meadows across the Pacific Northwest.\
      \  \nTo model the areal spatial extent of British Columbia a novel tool was\
      \ created for use in ArcGIS. This tool required 2 inputs: (1) the coastline\
      \ data from Shorezone (ie. vector line features with attributes on the presence\
      \ or absence of eelgrass along a linear extent of coastline) and (2) bathymetry\
      \ data. Briefly, each line segment of coast in ShoreZone was converted to points\
      \ along its vertices and points were used to generate Thiessen polygons. Thiessen\
      \ polygons were clipped to a selected bathymetric contour (5 m or 3 m) based\
      \ on the results of regional bathymetry analysis. The modeled outputs were compared\
      \ to available mapping data from the British Columbia Marine Conservation Analysis\
      \ Atlas to assess model accuracy.  \nPlease refer to the report summary for\
      \ the details on methods and caveats. \n\nLimitations and caveats:\n\nThe modeling\
      \ outputs of this work were dependent on (1) the resolution and accuracy of\
      \ bathymetric data (which was not available for all parts of the BC coast) and\
      \ (2) ShoreZone coverage (not all parts of the BC coast were surveyed using\
      \ ShoreZone methods at the time of the analysis). ShoreZone data has been shown\
      \ to underestimate the presence of eelgrass and the ability of ShoreZone to\
      \ map the presence of eelgrass depends on eelgrass being visible in the intertidal\
      \ and shallow subtidal region during the low tide imagery acquisition, therefore\
      \ deeper subtidal beds are missed. ShoreZone data, and therefore these modeled\
      \ outputs, represents a snapshot in time. Given known long-term dynamics of\
      \ eelgrass meadows, these data do not indicate areas that have undergone losses\
      \ or gains in eelgrass extent.  \n\nPlease refer to the report summary which\
      \ contains a map that shows regions where eelgrass extent was not modeled due\
      \ to the lack of available bathymetry and/or ShoreZone data."
    fr: "Cet ensemble de données représente l'étendue modélisée des prairies de zostères\
      \ marines (Zostera marina) sur la côte de la Colombie-Britannique, au Canada.\
      \ Cet ensemble de données a été généré entre 2016 et 2017 dans le cadre des\
      \ efforts de la Commission de coopération environnementale visant à estimer\
      \ le stockage du carbone bleu dans les prairies de zostères du nord-ouest du\
      \ Pacifique. \nPour modéliser l'étendue spatiale de la Colombie-Britannique,\
      \ un nouvel outil a été créé pour être utilisé dans ArcGIS. Cet outil nécessitait\
      \ deux entrées : (1) les données côtières de Shorezone (c'est-à-dire des caractéristiques\
      \ vectorielles avec des attributs sur la présence ou l'absence de zostère marine\
      \ le long d'une étendue linéaire du littoral) et (2) des données bathymétriques.\
      \ En bref, chaque segment de côte de ShoreZone a été converti en points situés\
      \ le long de ses sommets et les points ont été utilisés pour générer des polygones\
      \ de Thiessen. Les polygones de Thiessen ont été découpés selon un contour bathymétrique\
      \ sélectionné (5 m ou 3 m) sur la base des résultats d'une analyse bathymétrique\
      \ régionale. Les résultats modélisés ont été comparés aux données cartographiques\
      \ disponibles provenant de l'Atlas d'analyse de la conservation marine de la\
      \ Colombie-Britannique afin d'évaluer la précision du modèle. \nVeuillez consulter\
      \ le résumé du rapport pour plus de détails sur les méthodes et les mises en\
      \ garde. \nContactez data@hakai.org pour plus d'informations."
