identification:
  abstract:
    en: The Hakai Institute Deep-water Bioblitz (2019) was an intensive biodiversity
      survey subtidal habitats around Calvert Island, BC. There are significant gaps
      in our knowledge about the biodiversity of subtidal species, and the goal of
      this survey was to help fill those gaps. Subtotal specimens were collected by
      SCUBA and ROV. These specimens were brought to the for morphological identification,
      photographed, and then processed for DNA barcoding, with the resulting sequence
      data added to the Barcode of Life Datasystem (BOLD). Voucher specimens from
      these collections were accessioned at the Florida Museum of Natural History.
    fr: Le Bioblitz en eau profonde de l'Institut Hakai (2019) était une étude intensive
      de la biodiversité des habitats subtidaux autour de l'île Calvert, en Colombie-Britannique.
      Il existe d'importantes lacunes dans nos connaissances sur la biodiversité des
      espèces infratidales, et l'objectif de cette étude était de contribuer à combler
      ces lacunes. Le sous-total des échantillons a été collecté par SCUBA et ROV.
      Ces échantillons ont été apportés au centre pour identification morphologique,
      photographiés, puis traités pour le codage à barres de l'ADN, et les données
      de séquence qui en ont résulté ont été ajoutées au système de données Barcode
      of Life (BOLD). Des spécimens de ces collections ont été acquis au Florida Museum
      of Natural History.
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
