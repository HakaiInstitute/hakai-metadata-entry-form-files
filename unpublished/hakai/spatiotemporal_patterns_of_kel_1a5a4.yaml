identification:
  abstract:
    en: Changing environmental conditions and extreme events, including ocean warming
      and marine heatwaves, increasingly impact and threaten habitat-forming species
      like as kelps, the associated communities they support, and the ecosystem services
      they provide. Climate stressors affect not only kelp growth, development, persistence,
      and overall health, but also their associated microbial communities, including
      beneficial symbionts and opportunistic pathogens, potentially influencing host
      resilience. As the interest in host-associated microbiome research continues
      to grow, scientists are faced with numerous methodological choices when designing
      new studies. However, the extent to which these methodological decisions ‘matter’
      and influence results and biological interpretation remains questionable. To
      evaluate the effects of these methodological variations on bacterial communities,
      we collected surface tissue microbiome samples from two Pacific kelp species
      (wild Nereocystis luetkeana and farmed Saccharina latissima) in September 2025
      near Saanichton, British Columbia. We compared the results of both species,
      two swab types, based on three sample preservation methods, tested three DNA
      extraction kits, and two primer sets for 16S rRNA gene amplicon sequencing to
      assess their effects on bacterial diversity and community composition. Our results
      will provide practical guidance for marine microbiologists and ecologists designing
      future studies and monitoring programs.
    fr: L'évolution des conditions environnementales et les événements extrêmes, notamment
      le réchauffement des océans et les vagues de chaleur marines, ont un impact
      et une menace de plus en plus importants sur les espèces formant des habitats,
      comme le varech, les communautés associées qu'elles abritent et les services
      écosystémiques qu'elles fournissent. Les facteurs de stress climatiques affectent
      non seulement la croissance, le développement, la persistance et la santé globale
      du varech, mais également les communautés microbiennes associées, y compris
      les symbiotes bénéfiques et les agents pathogènes opportunistes, influençant
      potentiellement la résilience de l'hôte. Alors que l'intérêt pour la recherche
      sur le microbiome associé à l'hôte ne cesse de croître, les scientifiques sont
      confrontés à de nombreux choix méthodologiques lorsqu'ils conçoivent de nouvelles
      études. Cependant, la mesure dans laquelle ces décisions méthodologiques « comptent »
      et influencent les résultats et l'interprétation biologique reste discutable.
      Pour évaluer les effets de ces variations méthodologiques sur les communautés
      bactériennes, nous avons prélevé des échantillons de microbiome des tissus de
      surface de deux espèces de varech du Pacifique (Nereocystis luetkeana sauvage
      et Saccharina latissima d'élevage) en septembre 2025 près de Saanichton, en
      Colombie-Britannique. Nous avons comparé les résultats des deux espèces, de
      deux types d'écouvillons, sur la base de trois méthodes de conservation des
      échantillons, testé trois kits d'extraction d'ADN et deux ensembles d'amorces
      pour le séquençage des amplicons du gène de l'ARNr 16S afin d'évaluer leurs
      effets sur la diversité bactérienne et la composition de la communauté. Nos
      résultats fourniront des conseils pratiques aux microbiologistes et écologistes
      marins qui concevront de futures études et programmes de surveillance.
