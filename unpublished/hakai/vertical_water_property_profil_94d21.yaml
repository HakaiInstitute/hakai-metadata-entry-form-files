identification:
  abstract:
    en: "Temperature, conductivity, dissolved oxygen, fluorescence, photosynthetic\
      \ active radiation, turbidity, and coloured dissolved organic matter data collected\
      \ from 2012 to present by the Hakai Institute in waters surrounding Calvert\
      \ Island, Johnstone Strait, and Quadra Island areas.\n\nThis includes datasets\
      \ made by oceanographic profiler instruments (RBR XR-620, RBR Concerto, RBR\
      \ Maestro, and Seabird SBE 19plus v2) which have been automatically processed\
      \ by following respective manufacturer's guidelines (see Hakai Water Properties\
      \ Profile Processing and QA/QC Procedure Manual). This also includes a dataset\
      \ from a C-PROOF (Canadian Pacific Robotic Ocean Observing Facility) Wirewalker,\
      \ a wave-powered profiler moored in Bute Inlet, a fjord on the British Columbia\
      \ coast.\n\nThe provisional processed CTD data are then quality controlled by\
      \ applying a series of tests that are following the QARTOD standards and more\
      \ tests specific to the Hakai Institute data (see Hakai Water Properties Profile\
      \ Processing and QA/QC Procedure Manual). The research CTD dataset provides\
      \ a subset of the provisional dataset which has been manually reviewed and judged\
      \ good for science quality level.\n\nTwo versions of the Wirewalker record are\
      \ included: provisional data offloaded directly from the instrument, which is\
      \ the more complete, and real-time data received via satellite, which is the\
      \ more current. \n\n\n\nData were collected by the Hakai Institute Oceanography\
      \ Program, the Nearshore Program, and the Juvenile Salmon Program."
    fr: "Données sur la température, la conductivité, l'oxygène dissous, la fluorescence,\
      \ le rayonnement photosynthétique actif, la turbidité et la matière organique\
      \ dissoute colorée recueillies de 2012 à aujourd'hui par l'Institut Hakai dans\
      \ les eaux entourant les régions de l'île Calvert, du détroit de Johnstone et\
      \ de l'île Quadra.\n\nCela inclut des ensembles de données créés par des instruments\
      \ de profilage océanographique (RBR XR-620, RBR Concerto, RBR Maestro et Seabird\
      \ SBE 19plus v2) qui ont été automatiquement traités conformément aux directives\
      \ des fabricants respectifs (voir Hakai Water Properties Profile Processing\
      \ et QA/QC Procedure Manual). Cela inclut également un ensemble de données provenant\
      \ d'un Wirewalker C-PROOF (Centre robotique d'observation des océans du Canada\
      \ dans le Pacifique), un profileur houlomoteur amarré à Bute Inlet, un fjord\
      \ sur la côte de la Colombie-Britannique.\n\nLes données CTD traitées provisoires\
      \ sont ensuite contrôlées de qualité en appliquant une série de tests conformes\
      \ aux normes QARTOD et d'autres tests spécifiques aux données de l'Institut\
      \ Hakai (voir Hakai Water Profile Processing and QA/QC Procedure Manual). L'ensemble\
      \ de données CTD de recherche fournit un sous-ensemble de l'ensemble de données\
      \ provisoire qui a été examiné manuellement et jugé bon pour le niveau de qualité\
      \ scientifique.\n\nDeux versions de l'enregistrement Wirewalker sont incluses :\
      \ les données provisoires provenant directement de l'instrument, qui sont les\
      \ plus complètes, et les données en temps réel reçues par satellite, qui sont\
      \ les plus récentes. \n\n\n\nLes données ont été recueillies par le programme\
      \ océanographique de l'Institut Hakai, le programme Nearshore et le programme\
      \ sur les saumons juvéniles."
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
