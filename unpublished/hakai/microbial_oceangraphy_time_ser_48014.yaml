identification:
  abstract:
    en: "Microbes (Bacteria, Archaea, and Protists) play important roles in marine\
      \ food webs. They are primary producers and food for higher trophic levels.\
      \ They are carbon and nutrient cyclers, driving global biogeochemical cycles.\
      \ The coastal margin of British Columbia is experiencing multi-stressor events\
      \ that have the potential to greatly impact ecosystem function. Developing a\
      \ climatology is essential for uncovering the physical, chemical and biological\
      \ drivers of marine microbial community change in this region and elucidating\
      \ community responses to increasingly frequent ocean perturbations. \n\nFrom\
      \ 2015-2025, The Hakai Institute Ocean Observing Program routinely collected\
      \ samples from multiple long-term oceanographic monitoring stations to establish\
      \ planktonic biodiversity baselines in the Northern Salish Sea (weekly; Station\
      \ QU39: 50.0307, -125.0992) and on the British Columbia Central Coast (every\
      \ 4-8 weeks; Station FZH01 (2016-2019): 51.6394, -127.8958; Station KC10 (2019-2025):\
      \ 51.650, -127.9516). As part of this effort, seawater environmental DNA samples\
      \ were collected from 5 depths spanning the entire water column (0, 5, 30, 100\
      \ and 260/275/325 m respectively) to genetically characterize marine microbes\
      \ at an unprecedented temporal resolution. \n\nSpecifically, DNA was extracted\
      \ from these 0.2 um-filtered seawater samples and marker genes were amplified\
      \ using up to two different primer sets:\n\n1. The 515FY/926R universal three-domain\
      \ rRNA gene primers, simultaneously quantifying the relative abundance of amplicon\
      \ sequencing variants (ASVs) from bacteria 16S, archaea 16S, eukaryotic nuclear\
      \ 18S, and eukaryotic plastid 16S genes, and\n2. The V4F/V4RB eukaryote-specific\
      \ primers, quantifying the relative abundance of eukaryotic nuclear 18S ASVs\
      \ only.\n\nAmplicon libraries were sequenced on an Illumina MiSeq or NextSeq\
      \ and processed using the open-source bioinformatics software dada2, as implemented\
      \ in QIIME2. These data constitute a important biomolecular baseline for coastal\
      \ British Columbia marine planktonic biodiversity.\n\nThis data package contains\
      \ links to the raw sequence data, wet-lab protocols, and associated physical\
      \ and chemical oceanographic data. It is freely available to everyone, following\
      \ the principles of equitable access and benefit sharing. However, we expect\
      \ all data users to give attribution to the data providers (read our data license)\
      \ and the use of these data should happen in the light of fair use, i.e.: 1)\
      \ respect the data providers, and provide helpful feedback on data quality,\
      \ and 2) communicate and/or collaborate with the providers if you are considering\
      \ using this dataset for manuscripts or other forms of reporting."
    fr: "Les microbes (bactéries, archées et protistes) jouent un rôle important dans\
      \ les réseaux trophiques marins. Ce sont des producteurs primaires et des aliments\
      \ pour les niveaux trophiques supérieurs. Ce sont des cycleurs du carbone et\
      \ des nutriments qui sont à l'origine des cycles biogéochimiques mondiaux. La\
      \ marge côtière de la Colombie-Britannique est confrontée à de multiples facteurs\
      \ de stress susceptibles d'avoir de graves répercussions sur le fonctionnement\
      \ de l'écosystème. Le développement d'une climatologie est essentiel pour découvrir\
      \ les facteurs physiques, chimiques et biologiques du changement de la communauté\
      \ microbienne marine dans cette région et pour élucider les réponses des communautés\
      \ aux perturbations océaniques de plus en plus fréquentes. \n\nDe 2015 à 2025,\
      \ le programme d'observation des océans de l'Institut Hakai a prélevé régulièrement\
      \ des échantillons auprès de plusieurs stations de surveillance océanographique\
      \ à long terme afin d'établir des données de référence pour la biodiversité\
      \ planctonique dans le nord de la mer des Salish (chaque semaine ; station QU39 :\
      \ 50,0307, -125,0992) et sur la côte centrale de la Colombie-Britannique (toutes\
      \ les 4 à 8 semaines) ; Station FZH01 (2016-2019) : 51,6394, -127,8958 ; Station\
      \ KC10 (2019-2025) : 51,6394, -127,8958 ; Station KC10 (2019-2025) : 51,650,\
      \ -127,9516). Dans le cadre de cet effort, des échantillons d'ADN environnemental\
      \ d'eau de mer ont été prélevés à 5 profondeurs couvrant l'ensemble de la colonne\
      \ d'eau (0, 5, 30, 100 et 260/275/325 m respectivement) afin de caractériser\
      \ génétiquement les microbes marins avec une résolution temporelle sans précédent.\
      \ \n\nPlus précisément, l'ADN a été extrait de ces échantillons d'eau de mer\
      \ filtrés à 0,2 µm et les gènes marqueurs ont été amplifiés en utilisant jusqu'à\
      \ deux ensembles d'amorces différents :\n\n1. Les amorces géniques universelles\
      \ d'ARNr à trois domaines 515FY/926R, quantifiant simultanément l'abondance\
      \ relative des variants de séquençage d'amplicons (ASV) provenant des gènes\
      \ des bactéries 16S, des archées 16S, du noyau eucaryote 18S et des gènes 16S\
      \ du plaste eucaryote, et\n2. Les amorces spécifiques aux eucaryotes V4F/V4RB,\
      \ quantifiant uniquement l'abondance relative des ASV 18S nucléaires eucaryotes.\n\
      \nLes bibliothèques d'amplicons ont été séquencées sur un Illumina MiSeq ou\
      \ NextSeq et traitées à l'aide du logiciel bioinformatique open source dada2,\
      \ tel qu'implémenté dans QIIME2. \n\nCes données constituent une base biomoléculaire\
      \ importante pour la biodiversité planctonique marine côtière de la Colombie-Britannique.\n\
      \nCe package de métadonnées contient des liens vers les données de séquence\
      \ brutes et les données océanographiques physiques et chimiques associées."
