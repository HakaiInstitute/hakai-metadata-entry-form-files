identification:
  abstract:
    en: "This dataset collection contains phytoplankton and zooplankton observations\
      \ from coastal British Columbia, Canada, and Southeast Alaska, United States.\n\
      \n\nPhytoplankton observations include:\n- Sentinel 3A and 3B chlorophyll-a\
      \ (Chla) and suspended particulate matter (SPM) imagery for coastal and offshore\
      \ British Columbia (BC) and Southeast Alaska waters, both as daily and 8 day\
      \ averages\n- Concentrations of phytoplankton pigments from High-Performance\
      \ Liquid Chromatography (HPLC) analysis of water collected from niskin bottles,\
      \ to estimate phytoplankton group-level biomass contributions within bulk water\
      \ samples in the Northern Salish Sea and Central Coast from 2015-2025\n- Chlorophyll\
      \ and phaeopigment concentrations from water collected from niskin bottles,\
      \ collected from 2017 to 2026 within the Calvert Island, Johnstone Strait, and\
      \ the Quadra Island study regions \n- Protistan plankton community composition,\
      \ via optical microscopy, at multiple time series and spatial survey stations\
      \ across the northern Salish Sea (Strait of Georgia) and central coast, and\
      \ within False Creek, British Columbia from 2016 - 2025\n\n\nZooplankton observations\
      \ include:\n- Size-fractionated zooplankton biomass and isotope data obtained\
      \ from collecting samples with vertical net hauls from 201__ to 202__ within\
      \ the Calvert Island, Johnstone Strait, and the Quadra Island study regions\
      \ \n- Zooplankton abundance and biomass data obtained from analyzing microscopy\
      \ samples collected with vertical net hauls from 201__ to 202__ within the Calvert\
      \ Island, Johnstone Strait, and the Quadra Island study regions \n- Fatty acids\
      \ of particulate matter collected from 2015 to 2018 near Quadra Island, British\
      \ Columbia, Canada \n- Mesozooplankton taxonomy data collected from the northern\
      \ Strait of Georgia, Discovery Islands, Johnstone Strait, and Queen Charlotte\
      \ Strait from April to July of 2015 and 2016"
    fr: "Cette collection de jeux de données contient des observations de phytoplancton\
      \ et de zooplancton provenant de la côte de la Colombie-Britannique, au Canada,\
      \ et du sud-est de l'Alaska, aux États-Unis.\n\n\nLes observations sur le phytoplancton\
      \ incluent :\n- Imagerie Sentinel 3A et 3B de la chlorophylle-a (Chla) et des\
      \ particules en suspension (SPM) pour les eaux côtières et extracôtières de\
      \ la Colombie-Britannique (Colombie-Britannique) et du sud-est de l'Alaska,\
      \ à la fois en moyenne quotidienne et sur 8 jours\n- Concentrations de pigments\
      \ phytoplanctoniques issues de l'analyse par chromatographie liquide à haute\
      \ performance (HPLC) de l'eau collectée dans des bouteilles Niskin, afin d'estimer\
      \ les contributions à la biomasse au niveau du groupe phytoplancton dans des\
      \ échantillons d'eau en vrac dans le nord de la mer des Salish et la côte centrale\
      \ de 2015 à 2025\n- Concentrations de chlorophylle et de phéopigments dans l'eau\
      \ collectée dans des bouteilles Niskin, collectée de 2017 à 2026 dans les régions\
      \ d'étude de l'île Calvert, du détroit de Johnstone et de l'île Quadra \n- Composition\
      \ de la communauté de plancton protiste, par microscopie optique, dans de multiples\
      \ séries chronologiques et stations de relevés spatiaux dans le nord de la mer\
      \ des Salish (détroit de Géorgie) et la côte centrale, ainsi qu'à False Creek,\
      \ en Colombie-Britannique, de 2016 à 2025\n\n\nLes observations du zooplancton\
      \ incluent :\n- Données sur la biomasse et les isotopes du zooplancton fractionnées\
      \ en fonction de la taille obtenues à partir de la collecte d'échantillons par\
      \ des filets verticaux de 201__ à 202__ dans les régions d'étude de l'île Calvert,\
      \ du détroit de Johnstone et de l'île Quadra \n- Données sur l'abondance et\
      \ la biomasse du zooplancton obtenues à partir de l'analyse d'échantillons microscopiques\
      \ prélevés au moyen de filets verticaux de 201__ à 202__ dans les régions d'étude\
      \ de l'île Calvert, du détroit de Johnstone et de l'île Quadra \n- Acides gras\
      \ contenus dans les particules collectés de 2015 à 2018 près de l'île Quadra,\
      \ en Colombie-Britannique, au Canada \n- Données taxonomiques du mésozooplancton\
      \ recueillies dans le nord du détroit de Géorgie, les îles Discovery, le détroit\
      \ de Johnstone et le détroit de la Reine-Charlotte d'avril à juillet 2015 et\
      \ 2016"
    translations:
