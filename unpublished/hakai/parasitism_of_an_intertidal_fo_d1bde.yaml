identification:
  abstract:
    en: 'Parasites of foundation species, such as fucoids, mussels, and barnacles,
      can shape the intertidal communities that depend on them, yet their effects
      remain poorly understood. On rocky shores of the Northeast Pacific, the acorn
      barnacle Balanus glandula forms dense aggregations that provide habitat for
      other species. We investigated infection by the microphallid trematode Maritrema
      gratiosum in its second intermediate host, B. glandula, in British Columbia,
      Canada. First, we described the metacercarial cysts and examined how host morphology
      (in spring and summer) and reproductive output relate to infection. Second,
      we examined how infection varies with host position on live mussel shells, substratum
      type (rock versus mussel shells), and shore height. Third, we related prevalence
      and parasite load (number of cysts per host) to local air and sea-surface temperatures.
      Cysts had a mean diameter of 604 ± 46 µm and 80% of them occurred in fewer than
      20% of hosts. Host size predicted infection differently at two scales: within
      sites, larger barnacles were more likely to be infected, but among sites, infection
      was most likely in populations of intermediate mean size. Among infected hosts,
      parasite load was associated with host shape and became strongly size-dependent
      later in the season. Brood mass scaled hyper-allometrically with somatic mass
      (b = 1.27) and was unrelated to parasite load, while the scaling of parasite
      load with host mass differed among sites. Infection intensity (cysts per g of
      somatic tissue) did not vary with host position on mussels or between substrata,
      but varied unimodally with shore height, peaking at ~2.9 m above chart datum.
      At a larger spatial scale around Vancouver Island, 70.7% of barnacles were infected
      with site prevalence ranging from 0 to 100%. Infection probability increased
      with host size but was unrelated to temperature. Parasite load, however, increased
      with host size and with warmer-than-usual sea-surface temperatures, but decreased
      with warmer-than-usual air temperatures. Relationships among individual hosts
      did not consistently hold across sites, seasons, or thermal environments, suggesting
      that host demography, immersion time, and parasite supply jointly structure
      infection in this intertidal foundation species.'
    fr: 'Les parasites des espèces de base, telles que les fucoïdes, les moules et
      les balanes, peuvent façonner les communautés intertidales qui en dépendent,
      mais leurs effets restent mal connus. Sur les côtes rocheuses du Pacifique Nord-Est,
      la bernache cendrée Balanus glandula forme des agrégats denses qui fournissent
      un habitat à d''autres espèces. Nous avons étudié l''infection par le trématode
      microphallide Maritrema gratiosum chez son deuxième hôte intermédiaire, B. glandula,
      en Colombie-Britannique, au Canada. Tout d''abord, nous avons décrit les kystes
      métacercariens et examiné comment la morphologie de l''hôte (au printemps et
      en été) et le taux de reproduction étaient liés à l''infection. Ensuite, nous
      avons examiné comment l''infection varie en fonction de la position de l''hôte
      sur les coquilles de moules vivantes, du type de substrat (coquilles de roches
      par rapport aux coquilles de moules) et de la hauteur du rivage. Troisièmement,
      nous avons établi un lien entre la prévalence et la charge parasitaire (nombre
      de kystes par hôte) et les températures locales de l''air et de la surface de
      la mer. Les kystes avaient un diamètre moyen de 604 ± 46 µm et 80 % d''entre
      eux sont apparus chez moins de 20 % des hôtes. La taille de l''hôte permettait
      de prédire l''infection différemment à deux échelles : à l''intérieur des sites,
      les balanes de plus grande taille étaient plus susceptibles d''être infectées,
      mais parmi les sites, l''infection était plus probable dans les populations
      de taille moyenne intermédiaire. Parmi les hôtes infectés, la charge parasitaire
      était associée à la forme de l''hôte et est devenue fortement dépendante de
      la taille plus tard dans la saison. La masse du couvain était mise à l''échelle
      hyperallométrique par rapport à la masse somatique (b = 1,27) et n''était pas
      liée à la charge parasitaire, tandis que l''échelle de la charge parasitaire
      en fonction de la masse de l''hôte différait d''un site à l''autre. L''intensité
      de l''infection (kystes par g de tissu somatique) ne variait pas selon la position
      de l''hôte sur les moules ou entre les substrats, mais variait de façon unimodale
      selon la hauteur du rivage, culminant à environ 2,9 m au-dessus du point de
      référence cartographique. À une plus grande échelle spatiale autour de l''île
      de Vancouver, 70,7 % des bernaches étaient infectées avec une prévalence localisée
      allant de 0 à 100 %. La probabilité d''infection augmentait avec la taille de
      l''hôte mais n''était pas liée à la température. La charge parasitaire augmentait
      toutefois avec la taille de l''hôte et avec des températures de surface de la
      mer plus élevées que d''habitude, mais diminuait avec des températures de l''air
      plus chaudes que d''habitude. Les relations entre les hôtes individuels n''étaient
      pas constantes selon les sites, les saisons ou les environnements thermiques,
      ce qui suggère que la démographie de l''hôte, la durée d''immersion et l''approvisionnement
      en parasites structurent conjointement l''infection chez cette espèce de base
      intertidale.'
