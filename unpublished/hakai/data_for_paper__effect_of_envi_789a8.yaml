identification:
  abstract:
    en: Sampling and sequencing marine environmental DNA (eDNA) provides a tool that
      can increase our ability to monitor biodiversity, but movement and mixing of
      eDNA after release from organisms before collection could affect our inference
      of species distributions. To assess how conditions at differing spatial scales
      influence the inferred species richness and compositional turnover, we conducted
      a paired eDNA metabarcoding and capture (beach seining) survey of fishes on
      the coast of British Columbia. We found more taxa were typically detected using
      eDNA compared to beach seining. eDNA identified more taxa with alternative habitat
      preferences, and this richness difference was greater in areas of high seawater
      movement, suggesting eDNA has a larger spatial grain influenced by water motion.
      By contrast, we found that eDNA consistently missed low biomass species present
      in seining surveys. Spatial turnover of communities surveyed using beach seining
      differed from that of the eDNA and was better explained by factors that vary
      at small (10–1000s meters) spatial scales. Specifically, vegetation cover and
      shoreline exposure explained most species turnover from seining, while eDNA
      turnover was not explained by those factors and showed a distance decay pattern
      (a change from 10% to 25% similarity from 2 km to 10 km of distance), suggesting
      unmeasured environmental variation at larger scales drives its turnover. Our
      findings indicate that the eDNA sample grain is larger than that of capture
      surveys. Whereas seining can detect differences in fish distributions at scales
      of 10s–100s of meters, eDNA can best summarize fish biodiversity at larger scales
      possibly more relevant to regional biodiversity assessments.
    fr: L'échantillonnage et le séquençage de l'ADN environnemental marin (ADNe) constituent
      un outil qui peut accroître notre capacité à surveiller la biodiversité, mais
      le mouvement et le mélange de l'ADNe après sa libération par les organismes
      avant la collecte pourraient affecter notre inférence sur la distribution des
      espèces. Pour évaluer l'influence des conditions à différentes échelles spatiales
      sur la richesse en espèces et le renouvellement de la composition déduits, nous
      avons mené un relevé apparié de métabarcodage à barres et de capture (pêche
      à la senne de plage) de poissons sur la côte de la Colombie-Britannique. Nous
      avons découvert qu'un plus grand nombre de taxons étaient généralement détectés
      à l'aide de l'ADNe par rapport à la pêche à la senne sur les plages. L'ADNe
      a identifié un plus grand nombre de taxons présentant d'autres préférences en
      matière d'habitat, et cette différence de richesse était plus importante dans
      les zones à fort mouvement de l'eau, ce qui suggère que l'ADNe possède un grain
      spatial plus important influencé par le mouvement de l'eau. En revanche, nous
      avons constaté que l'ADNe passait régulièrement pas en revue les espèces à faible
      biomasse présentes dans les relevés à la senne. Le renouvellement spatial des
      communautés étudiées à l'aide de la senne de plage différait de celui de l'eDNA
      et s'expliquait mieux par des facteurs qui varient à de petites échelles spatiales
      (10 à 1 000 mètres). Plus précisément, la couverture végétale et l'exposition
      au littoral expliquaient la plupart des renouvellements d'espèces dus à la pêche
      à la senne, tandis que le renouvellement de l'ADNe n'était pas expliqué par
      ces facteurs et présentait un schéma de dégradation de la distance (une variation
      de 10 % à 25 % de similitude entre 2 km et 10 km de distance), ce qui suggère
      que des variations environnementales non mesurées à plus grande échelle sont
      à l'origine de son renouvellement. Nos résultats indiquent que le grain de l'échantillon
      d'ADNe est plus gros que celui des enquêtes de capture. Alors que la pêche à
      la senne permet de détecter des différences dans la distribution des poissons
      à des échelles de 10 à 100 mètres, l'ADNe peut mieux résumer la biodiversité
      des poissons à de plus grandes échelles, peut-être plus pertinentes pour les
      évaluations régionales de la biodiversité.
