identification:
  abstract:
    en: This metadata entry contains information about the Integrated Coastal Observatory
      (ICO), which was a coordinated network of partners along the coast of British
      Columbia who are using eDNA to monitor marine biodiversity. This diverse network
      includes First Nations, government scientists, citizen scientists, and NGOs.
      At the core of this initiative is the desire to generate high-quality open-data
      that can be used by our partners to quantify regional biodiversity. Environmental
      DNA samples from seawater are collected monthly to track the diversity of fish
      present at each partner location site. The resulting data provide an important
      tool for monitoring changes in diversity over broad spatial and temporal scales.
      Our results demonstrate the advantages of democratizing the collection and dissemination
      of eDNA-based biodiversity data. Long-term eDNA-based monitoring in coastal
      BC will help us to measure ecosystem health and track the impacts of climate
      change and other disturbances on marine biodiversity.
    fr: Cette entrée de métadonnées contient des informations sur l'Observatoire côtier
      intégré (ICO), qui était un réseau coordonné de partenaires le long de la côte
      de la Colombie-Britannique qui utilisent l'eDNA pour surveiller la biodiversité
      marine. Ce réseau diversifié comprend des membres des Premières Nations, des
      scientifiques gouvernementaux, des scientifiques citoyens et des ONG. Au cœur
      de cette initiative se trouve le désir de générer des données ouvertes de haute
      qualité pouvant être utilisées par nos partenaires pour quantifier la biodiversité
      régionale. Des échantillons d'ADN environnemental provenant de l'eau de mer
      sont collectés tous les mois pour suivre la diversité des poissons présents
      sur chaque site partenaire. Les données qui en résultent constituent un outil
      important pour suivre l'évolution de la diversité sur de larges échelles spatiales
      et temporelles. Nos résultats démontrent les avantages de la démocratisation
      de la collecte et de la diffusion de données sur la biodiversité basées sur
      l'EDNA. La surveillance à long terme basée sur l'ADNe sur la côte de la Colombie-Britannique
      nous aidera à mesurer la santé des écosystèmes et à suivre les impacts du changement
      climatique et d'autres perturbations sur la biodiversité marine.
