identification:
  abstract:
    en: 'Measurements of the carbon dioxide system, dissolved inorganic nutrients,
      and organic carbon span fresh and marine waters of the Northeast Pacific coast
      of North America from 2013 to 2026. Variables include pCO2 and total dissolved
      inorganic carbon (TCO2), with derived total alkalinity, pH, and aragonite saturation
      state; nutrients; dissolved and particulate matter, with stable isotope ratios
      and dissolved organic matter fluorescence; and supporting physical parameters.


      Sampling ranged from biweekly water column profiles and roughly monthly stream
      and marine surveys. Sites span rainforest watersheds and channels on Calvert
      and Hecate Islands, oceanographic stations on the British Columbia Central Coast
      and northern Strait of Georgia, northern Salish Sea stations, and the Kenai
      Peninsula, from the surface to 600 m.


      Together they establish baselines and characterize variability in coastal carbon
      and nutrient chemistry, supporting detection of ocean acidification and land-to-ocean
      carbon and nutrient transfer.'
    fr: 'Les mesures du système de dioxyde de carbone, des nutriments inorganiques
      dissous et du carbone organique concernent les eaux douces et marines de la
      côte nord-est du Pacifique en Amérique du Nord de 2013 à 2026. Les variables
      comprennent la pCO2 et le carbone inorganique dissous total (TCO2), avec l''alcalinité
      totale dérivée, le pH et l''état de saturation de l''aragonite ; les nutriments ;
      les matières dissoutes et particulaires, avec des rapports isotopiques stables
      et une fluorescence de la matière organique dissoute ; et les paramètres physiques
      connexes.


      L''échantillonnage comprenait des profils de colonne d''eau bihebdomadaires
      et des relevés fluviaux et marins environ une fois par mois. Les sites couvrent
      les bassins versants et les canaux de la forêt tropicale des îles Calvert et
      Hécate, les stations océanographiques de la côte centrale de la Colombie-Britannique
      et du nord du détroit de Georgia, les stations du nord de la mer des Salish
      et la péninsule de Kenai, depuis la surface jusqu''à 600 m.


      Ensemble, ils établissent des bases de référence et caractérisent la variabilité
      de la chimie du carbone et des nutriments côtiers, ce qui permet de détecter
      l''acidification des océans et le transfert de carbone et de nutriments entre
      la terre et l''océan.'
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
