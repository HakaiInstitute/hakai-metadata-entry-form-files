identification:
  abstract:
    en: In 2023, a number of multibeam surveys were performed in the Fraser River
      in order to characterize the riverbed. Of particular interest was the morphology
      of canyon walls along the river. The collected data were then used to assess
      landslide risk along the river, and to select areas where repeat surveys / monitoring
      could be done.
    fr: En 2023, un certain nombre de relevés multifaisceaux ont été réalisés dans
      le fleuve Fraser afin de caractériser le lit du fleuve. La morphologie des parois
      des canyons le long de la rivière était particulièrement intéressante. Les données
      collectées ont ensuite été utilisées pour évaluer le risque de glissement de
      terrain le long de la rivière et pour sélectionner les zones où des enquêtes
      et une surveillance répétées pourraient être effectuées.
    translations:
