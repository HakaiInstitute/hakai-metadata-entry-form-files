identification:
  abstract:
    en: This is a collection of high resolution coastal carbon monitoring datasets
      from instrumentation configured on shore-side infrastructure and oceanographic
      moorings in the Northeast Pacific beginning in 2014. These data provide information
      on the variability of inorganic carbon conditions over a range of temporal scales
      at select coastal sites in British Columbia.
    fr: Il s'agit d'une collection d'ensembles de données de surveillance du carbone
      côtier à haute résolution à partir d'instruments configurés sur les infrastructures
      côtières et les amarres océanographiques dans le Pacifique Nord-Est à partir
      de 2014. Ces données fournissent des informations sur la variabilité des conditions
      du carbone inorganique sur une gamme d'échelles temporelles sur certains sites
      côtiers de la Colombie-Britannique.
    translations:
      fr:
        message: text translated using the Amazon translate service / texte traduit
          à l'aide du service de traduction Amazon
        verified: false
