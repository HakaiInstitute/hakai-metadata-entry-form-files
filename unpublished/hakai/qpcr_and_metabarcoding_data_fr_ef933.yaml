identification:
  abstract:
    en: During the outmigration of Pacific Salmon, the early marine phase is a critical
      period when high mortality can occur. Traditional sampling and monitoring of
      juvenile salmon migration can be limited by logistically intensive gear requirements,
      accessibility, and cost. Improved understanding of the early marine phase, for
      example, migration duration and habitat use, requires innovative techniques
      that can improve the spatial and temporal coverage of monitoring. Environmental
      DNA (eDNA) is genetic fragments present in the environment that can be used
      as a proxy for organism presence and can be effectively and efficiently collected
      through water samples. Estimating fish abundance or biomass from eDNA concentration
      data would provide a valuable fisheries tool but remains challenging to calibrate.
      To quantify the relationship between eDNA abundance and fish biomass, we used
      a controlled mesocosm experiment, in which eDNA samples were collected from
      15 aquaria (340 L) with varying densities of juvenile Chinook salmon per tank
      (0, 5, 10, 20, and 30). The concentration of eDNA was obtained by qPCR scaled
      with fish biomass (ANOVA, p < 0.05). However, we also observed that variability
      of eDNA concentrations among replicates of the same treatment positively scaled
      biomass (ANOVA, p < 0.05). Therefore, higher biomasses of fish can yield more
      challenging data to interpret. This study lays important groundwork for the
      application of eDNA for monitoring juvenile salmonids yet highlights caveats
      for the applicability of eDNA as a stand-alone method to assess biomass in a
      field setting.
    fr: Pendant l'émigration du saumon du Pacifique, le début de la phase marine est
      une période critique au cours de laquelle un taux de mortalité élevé peut survenir.
      L'échantillonnage et la surveillance traditionnels de la migration des saumons
      juvéniles peuvent être limités par des exigences logistiques intensives en matière
      d'équipement, d'accessibilité et de coût. Une meilleure compréhension de la
      phase marine précoce, par exemple de la durée de la migration et de l'utilisation
      de l'habitat, nécessite des techniques innovantes qui peuvent améliorer la couverture
      spatiale et temporelle de la surveillance. L'ADN environnemental (ADNe) est
      constitué de fragments génétiques présents dans l'environnement qui peuvent
      être utilisés comme indicateur de la présence d'organismes et qui peuvent être
      collectés de manière efficace et efficiente au moyen d'échantillons d'eau. L'estimation
      de l'abondance ou de la biomasse des poissons à partir des données de concentration
      d'ADNe constituerait un outil de pêche précieux mais reste difficile à calibrer.
      Pour quantifier la relation entre l'abondance de l'ADNe et la biomasse des poissons,
      nous avons utilisé une expérience contrôlée en mésocosme, au cours de laquelle
      des échantillons d'ADNe ont été prélevés dans 15 aquariums (340 L) contenant
      différentes densités de saumons quinnats juvéniles par aquarium (0, 5, 10, 20
      et 30). La concentration d'ADNe a été obtenue par qPCR à l'échelle de la biomasse
      des poissons (ANOVA, p < 0,05). Cependant, nous avons également observé que
      la variabilité des concentrations d'ADNe entre les répétitions du même traitement
      augmentait positivement la biomasse (ANOVA, p < 0,05). Par conséquent, des biomasses
      de poissons plus élevées peuvent produire des données plus difficiles à interpréter.
      Cette étude jette des bases importantes pour l'application de l'ADNe à la surveillance
      des salmonidés juvéniles, mais met en évidence des réserves quant à l'applicabilité
      de l'ADNe en tant que méthode autonome pour évaluer la biomasse sur le terrain.
