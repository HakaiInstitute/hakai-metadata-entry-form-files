identification:
  abstract:
    en: The Hakai Institute maintains a weather station on located on Quadra Island
      near Hyacinthe Bay. The weather station measures the air temperature, wind speed
      and direction, humidity, atmospheric pressure, UV radiation, solar radiation,
      photosynthetically active radiation (PAR), and precipitation since July 2012.
    fr: L'Institut Hakai possède une station météorologique située sur l'île Quadra,
      près de la baie d'Hyacinthe. La station météorologique mesure la température
      de l'air, la vitesse et la direction du vent, l'humidité, la pression atmosphérique,
      le rayonnement UV, le rayonnement solaire, le PAR et les précipitations depuis
      juillet 2012.
