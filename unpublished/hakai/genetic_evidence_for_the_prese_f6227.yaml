identification:
  abstract:
    en: The microphallid trematode Maritrema gratiosum was detected using DNA-based
      assays in individuals of the barnacle Balanus glandula Darwin, 1854 that were
      collected from the rocky intertidal zone along the southern coast of British
      Columbia, Canada. This finding provides the first molecular evidence of this
      trematode species in the Pacific, complementing earlier records.
    fr: Le trématode microphallidé Maritrema gratiosum a été détecté à l'aide de tests
      basés sur l'ADN chez des individus de la balane Balanus glandula Darwin, 1854,
      capturés dans la zone intertidale rocheuse le long de la côte sud de la Colombie-Britannique,
      au Canada. Cette découverte fournit la première preuve moléculaire de cette
      espèce de trématode dans le Pacifique, complétant ainsi les données antérieures.
