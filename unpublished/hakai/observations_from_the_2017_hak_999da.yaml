identification:
  abstract:
    en: The Hakai-MarineGEO Bioblitz (2017) was an intensive biodiversity survey of
      the nearshore habitats around Calvert Island, BC. Throughout the three-week
      BioBlitz, teams of taxonomists and field biologists made collections of specimens
      that were morphologically identified in the lab, photographed, and then processed
      for DNA barcoding, with the resulting sequence data added to the Barcode of
      Life Datasystem (BOLD). Voucher specimens from these collections were accessioned
      at the Florida Museum of Natural History. This survey resulted in the identification
      of several new species and expanded the known range of many others.
    fr: Le Bioblitz Hakai-MarineGeo (2017) était une étude intensive de la biodiversité
      des habitats côtiers autour de l'île Calvert, en Colombie-Britannique. Tout
      au long des trois semaines de BioBlitz, des équipes de taxonomistes et de biologistes
      de terrain ont collecté des échantillons qui ont été identifiés morphologiquement
      en laboratoire, photographiés, puis traités pour un code-barres ADN, les données
      de séquence qui en ont résulté étant ajoutées au système de données Barcode
      of Life (BOLD). Des spécimens de ces collections ont été acquis au Florida Museum
      of Natural History. Cette étude a permis d'identifier plusieurs nouvelles espèces
      et d'élargir l'aire de répartition connue de nombreuses autres.
