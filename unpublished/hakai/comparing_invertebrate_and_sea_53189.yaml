identification:
  abstract:
    en: Artificial Reef Monitoring Structures (ARMS) are standardized units consisting
      of a stack of PVC plates that have been globally deployed in coral reef environments
      to monitor biodiversity. We tested the applicability of ARMS as a biodiversity
      monitoring system in NE Pacific temperate ecosystems, including kelp forests
      and urchin barrens. 10 ARMS were deployed for one year, five in a kelp forest
      and five in an adjacent urchin barren. Each ARMS unit was augmented with the
      addition of a 14x14 cm PVC settlement plate and a 20x7cm scrub brush; these
      two devices were replaced every 2 months. Seawater samples were collected in
      parallel every 2 months for the purposes of analyzing eDNA. We recorded a total
      of 420 animal species and 167 seaweed species across all devices and 305 animal
      species and 135 seaweed species from just the ARMS. ARMS accumulated species
      rapidly and did not reach an asymptote, suggesting that more than 10 replicates
      may be required to capture the full diversity able to settle on the ARMS. ARMS
      in the kelp and barren habitats were distinct, indicating a high potential for
      habitat resolution. We observed a very low degree of similarity between the
      ARMS and all other datasets included in this investigation – similarity was
      below 40% regardless of comparison (ARMS vs plates, ARMS vs eDNA). We observed
      a trend of decreasing similarity between the ARMS and the plates from April
      to January, indicating some influence of priority effects on structuring ARMS
      communities. However, the ARMS did support an additional richness component
      that is likely the result of successional processes, including facilitation.
    fr: 'Les structures de surveillance des récifs artificiels (ARMS) sont des unités
      standardisées composées d''une pile de plaques en PVC qui ont été déployées
      dans le monde entier dans les environnements de récifs coralliens pour surveiller
      la biodiversité. Nous avons testé l''applicabilité de l''ARMS en tant que système
      de surveillance de la biodiversité dans les écosystèmes tempérés du nord-est
      du Pacifique, y compris les forêts de varech et les landes à oursins. 10 ARMS
      ont été déployés pendant un an, cinq dans une forêt de varech et cinq dans une
      clairière à oursins adjacente. Chaque unité ARMS a été complétée par l''ajout
      d''une plaque de tassement en PVC de 14 x 14 cm et d''une brosse à récurer de
      20 x 7 cm ; ces deux appareils ont été remplacés tous les 2 mois. Des échantillons
      d''eau de mer ont été collectés en parallèle tous les 2 mois à des fins d''analyse
      de l''ADNe. Nous avons enregistré un total de 420 espèces animales et 167 espèces
      d''algues sur tous les appareils, ainsi que 305 espèces animales et 135 espèces
      d''algues à partir de l''ARMS uniquement. L''ARMS a accumulé rapidement des
      espèces et n''a pas atteint d''asymptote, ce qui suggère que plus de 10 répétitions
      pourraient être nécessaires pour capturer toute la diversité capable de s''installer
      sur l''ARMS. Les ARMS présents dans les habitats de varech et de terres arides
      étaient distincts, ce qui indique un fort potentiel de résolution de l''habitat.
      Nous avons observé un très faible degré de similitude entre l''ARMS et tous
      les autres ensembles de données inclus dans cette enquête : la similitude était
      inférieure à 40 % quelle que soit la comparaison (ARMS contre plaques, ARMS
      contre eDNA). Nous avons observé une tendance à la baisse de la similitude entre
      l''ARMS et les plaques d''avril à janvier, ce qui indique une certaine influence
      des effets de priorité sur la structuration des communautés ARMS. Cependant,
      l''ARMS a soutenu une composante de richesse supplémentaire qui est probablement
      le résultat de processus de succession, y compris la facilitation.'
