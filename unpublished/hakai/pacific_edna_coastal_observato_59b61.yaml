identification:
  abstract:
    en: The Pacific eDNA Coastal Observatory (PECO) is a coordinated network of partners
      using environmental DNA to track changes in marine biodiversity through time.
      Our network spans 26 degrees latitude (Alaska to Southern California), in a
      cross-national region of high economic and social interest in marine resource
      management. The goals of this project are to develop tools, platforms and networks
      to enable the use of environmental DNA for broad-scale biogeographic assessment,
      build capacity to track biodiversity changes through time, and connect users
      with updatable predictive tools on biodiversity changes. This catalogue entry
      links to the publicly available data collected between 2021-2024.
    fr: Le Pacific eDNA Coastal Observatory (PECO) est un réseau coordonné de partenaires
      utilisant l'ADN environnemental pour suivre l'évolution de la biodiversité marine
      au fil du temps. Notre réseau s'étend sur 26 degrés de latitude (de l'Alaska
      au sud de la Californie), dans une région transnationale présentant un grand
      intérêt économique et social pour la gestion des ressources marines. Les objectifs
      de ce projet sont de développer des outils, des plateformes et des réseaux permettant
      d'utiliser l'ADN environnemental pour des évaluations biogéographiques à grande
      échelle, de renforcer les capacités de suivi des changements de biodiversité
      dans le temps et de mettre en relation les utilisateurs avec des outils prédictifs
      actualisables sur les changements de biodiversité. Cette entrée du catalogue
      renvoie aux données accessibles au public collectées entre 2021 et 2024.
