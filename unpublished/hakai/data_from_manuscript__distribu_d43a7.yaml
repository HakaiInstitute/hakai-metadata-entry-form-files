identification:
  abstract:
    en: This dataset contains data and code used in the manuscript “Distribution and
      drivers of parasite abundance in the hermit crab Pagurus hirsutiusculus”. Further
      details about the methodology is located in the manuscript and its supplementary
      material. This data is meant to inform our understanding about what parasites
      are present in the host Pagurus hirsutiusculus, as well as what factors control
      their abundance. This study also investigates how parasite infection affects
      host thermal response. Hermit crabs were surveyed for prevalence and occurrence
      at a variety of sites from Calvert Island down to Southern Vancouver Island
      from August 2020 - September 2021. Host relative abundance, salinity, and host
      size were measured at the sites. DNA sequence data from three different parasites
      were obtained from Calvert Island, Quadra Island, and Maple Bay during this
      sampling period. Metabolic rate was measured at 5 temperatures (12°C, 17°C,
      22°C, 27°C, 32°C) in Pagurus hirsutiusculus infected by Peltogaster sp. and
      uninfected individuals in a laboratory at the University of British Columbia.
      Survival was recorded at ambient seawater conditions (12°C), and post temperature
      experiment. Moulting was also recorded at ambient seawater conditions. Additionally,
      this dataset contains occurrence and prevalence records of Peltogaster sp. found
      during a review of the literature conducted in the summer of 2020.
    fr: Cet ensemble de données contient les données et le code utilisés dans le manuscrit
      « Distribution et facteurs de l'abondance des parasites chez le crabe ermite
      Pagurus hirsutiusculus ». De plus amples détails sur la méthodologie se trouvent
      dans le manuscrit et ses documents supplémentaires. Ces données visent à mieux
      comprendre quels parasites sont présents chez l'hôte Pagurus hirsutiusculus,
      ainsi que les facteurs qui contrôlent leur abondance. Cette étude examine également
      comment l'infection parasitaire affecte la réponse thermique de l'hôte. La prévalence
      et la présence de crabes ermites ont été étudiées sur divers sites, de l'île
      Calvert au sud de l'île de Vancouver, d'août 2020 à septembre 2021. L'abondance
      relative, la salinité et la taille de l'hôte ont été mesurées sur les sites.
      Les données de séquence d'ADN de trois parasites différents ont été obtenues
      sur l'île Calvert, l'île Quadra et Maple Bay au cours de cette période d'échantillonnage.
      Le taux métabolique a été mesuré à 5 températures (12 °C, 17 °C, 22 °C, 27 °C,
      32 °C) chez Pagurus hirsutiusculus infecté par Peltogaster sp. et chez des sujets
      non infectés dans un laboratoire de l'Université de la Colombie-Britannique.
      La survie a été enregistrée dans des conditions ambiantes d'eau de mer (12 °C)
      et après une expérience de température. La mue a également été enregistrée dans
      des conditions ambiantes d'eau de mer. De plus, cet ensemble de données contient
      des données d'occurrence et de prévalence de Peltogaster sp. trouvées lors d'une
      revue de la littérature réalisée à l'été 2020.
